<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Laghetto Vivo — Carpe Koi</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#020806;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  #pond{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}

  .icon-btn{width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(180,240,220,.14);
    background:rgba(255,255,255,.045);color:#cfe9e0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;

  .icon-btn svg{width:20px;height:20px;stroke-width:1.8;

  .icon-btn:active{transform:scale(.9);}
  .icon-btn.on{background:linear-gradient(180deg,rgba(255,196,84,.35),rgba(255,150,40,.18));

  #hint{position:fixed;left:50%;top:calc(50% - 165px);transform:translateX(-50%);

  #zoomBadge{position:fixed;top:max(16px,env(safe-area-inset-top,16px));right:16px;

    padding:6px 12px;border-radius:999px;

    border:1px solid rgba(180,240,220,.15);
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;
    text-shadow:0 1px 6px rgba(0,0,0,.8);}
  #zoomBadge.show{opacity:1;}
  #climateBadge{position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:16px;
    display:flex;flex-direction:column;gap:2px;
    padding:8px 14px;border-radius:16px;
    background:rgba(8,22,18,.44);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(180,240,220,.15);
    color:rgba(210,240,232,.9);font-size:12.5px;font-weight:600;
    letter-spacing:.4px;z-index:9;
    text-shadow:0 1px 6px rgba(0,0,0,.8);
    transition:color .6s ease, border-color .6s ease;line-height:1.25;}
  #climateBadge .temp{font-size:15px;font-weight:700;letter-spacing:.2px;}
  #climateBadge .wx{font-size:10.5px;font-weight:500;opacity:.75;
    text-transform:uppercase;letter-spacing:1.2px;}
  #climateBadge.cold{color:#7dc4e8;border-color:rgba(125,196,232,.42);}
  #climateBadge.cool{color:#a8d8e8;border-color:rgba(168,216,232,.35);}
  #climateBadge.ideal{color:#8ed89a;border-color:rgba(142,216,154,.35);}
  #climateBadge.warm{color:#f0c070;border-color:rgba(240,192,112,.35);}
  #climateBadge.hot{color:#f08a5a;border-color:rgba(240,138,90,.42);}
  @media(max-width:420px){
    .icon-btn{width:40px;height:40px;}
    .icon-btn svg{width:18px;height:18px;}
    #ui{gap:6px;padding:6px;}
    #climateBadge{padding:6px 10px;}
    #climateBadge .temp{font-size:13px;}
  }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<div id="hint"><span class="glyph">🐟</span>Tocca l'acqua • <b>Nutri</b> per cibare<br><b>Pizzica con 2 dita</b> per zoomare</div>
<div id="zoomBadge">1.0×</div>
<div id="climateBadge">
  <span class="temp" id="tempVal">18°C</span>
  <span class="wx" id="wxVal">sereno</span>
</div>
<div id="ui">
  <button class="icon-btn" id="btnFeed" title="Nutri">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="1.2" fill="currentColor"/><circle cx="12" cy="7" r="1.2" fill="currentColor"/><circle cx="16" cy="9" r="1.2" fill="currentColor"/><path d="M3 13h18a9 9 0 0 1-9 8 9 9 0 0 1-9-8z"/></svg>
  </button>
  <button class="icon-btn" id="btnAuto" title="Nutri automatico">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-8.5-6"/><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 8.5 6"/><path d="M21 3v6h-6"/><path d="M3 21v-6h6"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn on" id="btnSfx" title="Suoni">
    <svg viewBox="0 0 24 24" id="sfxIcon"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
  </button>
  <button class="icon-btn" id="btnMusic" title="Musica">

  </button>
  <button class="icon-btn" id="btnFull" title="Schermo intero">

  </button>
</div>

<script>
"use strict";
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => ((a - b + Math.PI * 3) % TAU) - Math.PI;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const cv = document.getElementById('pond');
const ctx = cv.getContext('2d', { alpha: false });
const zoomBadge = document.getElementById('zoomBadge');
const climateBadge = document.getElementById('climateBadge');
const tempVal = document.getElementById('tempVal');
const wxVal = document.getElementById('wxVal');

let W = 0, H = 0, DPR = 1;
let cx = 0, cy = 0, rx = 0, ry = 0;
let pondPath = null, staticLayer = null;
let causticA = null, causticB = null, causticC = null;
let vignette = null;
let supportsFilter = false;

const view = { x: 0, y: 0, zoom: 1, targetX: 0, targetY: 0, targetZoom: 1 };
const MAX_ZOOM = 6;
let zoomBadgeTimer = null;

function screenToWorld(sx, sy) {
  return { x: (sx - W/2) / view.zoom + view.x, y: (sy - H/2) / view.zoom + view.y };
}
function inView(x, y, radius) {
  const sx = (x - view.x) * view.zoom + W/2;
  const sy = (y - view.y) * view.zoom + H/2;
  const margin = radius * view.zoom + 40;
  return sx > -margin && sx < W + margin && sy > -margin && sy < H + margin;
}
function clampView() {
  if (view.zoom <= 1.001) { view.zoom = Math.max(1, view.zoom); view.x = cx; view.y = cy; return; }
  const halfW = W / (2 * view.zoom), halfH = H / (2 * view.zoom);
  const minX = cx - rx + halfW, maxX = cx + rx - halfW;
  const minY = cy - ry + halfH, maxY = cy + ry - halfH;
  view.x = minX >= maxX ? cx : clamp(view.x, minX, maxX);
  view.y = minY >= maxY ? cy : clamp(view.y, minY, maxY);
}
function updateView(dt) {
  const smooth = 1 - Math.pow(0.0001, dt);
  view.zoom += (view.targetZoom - view.zoom) * smooth;
  view.x += (view.targetX - view.x) * smooth;
  view.y += (view.targetY - view.y) * smooth;
  if (Math.abs(view.zoom - view.targetZoom) < 0.001) {
    view.zoom = view.targetZoom; view.x = view.targetX; view.y = view.targetY;
  }
  clampView();
  if (zoomBadgeTimer) { clearTimeout(zoomBadgeTimer); zoomBadgeTimer = null; }
  if (view.zoom > 1.05) {
    zoomBadge.textContent = view.zoom.toFixed(1) + '×';
    zoomBadge.classList.add('show');
    zoomBadgeTimer = setTimeout(() => zoomBadge.classList.remove('show'), 800);
  } else zoomBadge.classList.remove('show');
}

let kois = [], foods = [], ripples = [], splashP = [], crumbs = [],
    algae = [], moss = [], eggs = [], particles = [],
    insects = [], frogs = [], plants = [], caves = [], rockSurface = [],
    shelterLeaves = [];
let time = 0, lastT = 0;
let feedMode = false, autoFeed = false, autoFeedTimer = 8;
let draggedPad = null;
let nextKoiId = 1;
let generationPeak = 1;
let worldAge = 0;

const pointers = new Map();
let pinchStart = null;
let tapStart = null;
let panStart = null;
let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

/* ==========================================================
   PALETTE KOI — colori giapponesi tradizionali
   ========================================================== */
const KOI_PALETTE = {
  shiro:    '#f8f4ec', // 白 Shiro — bianco candido
  hi:       '#b81c14', // 緋 Hi — rosso intenso
  aka:      '#e63946', // 赤 Aka — rosso brillante
  sumi:     '#181820', // 墨 Sumi — nero inchiostro
  kuro:     '#2a2020', // 黒 Kuro — nero caldo
  ki:       '#f5d020', // 黄 Ki — giallo puro
  kin:      '#c89820', // 金 Kin — oro metallizzato
  orenji:   '#e87a1e', // オレンジ Orenji — arancio vivo
  cha:      '#8b6b3d', // 茶 Cha — marrone tè / bronzo
  sora:     '#a8bcc4', // 空 Sora — blu-grigio cielo
  nezumi:   '#8a8a92', // 鼠 Nezumi — grigio argento opaco
  ai:       '#3a5a8c', // 藍 Ai — indaco
  midori:   '#a8b878', // 緑 Midori — verde salvia
  gin:      '#c8c8cc', // 銀 Gin — argento brillante
  puratina: '#e8e8ec'  // プラチナ Puratina — platino lucido
};

function hexToHSL(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 100, l: l * 100 };
}
// Mescolamento circolare dell'hue
function mixHue(h1, h2, w) {
  const r1 = h1 * Math.PI / 180, r2 = h2 * Math.PI / 180;
  const x = Math.cos(r1) * w + Math.cos(r2) * (1 - w);
  const y = Math.sin(r1) * w + Math.sin(r2) * (1 - w);
  let result = Math.atan2(y, x) * 180 / Math.PI;
  if (result < 0) result += 360;
  return result;
}

const KOI_VARIETIES = [
  { name: 'Kohaku',       base: 'shiro',    patch: 'hi',      accent: null,       pattern: 'patches',     metal: 0 },
  { name: 'Sanke',        base: 'shiro',    patch: 'hi',      accent: 'sumi',     pattern: 'patches_bk',  metal: 0 },
  { name: 'Showa',        base: 'sumi',     patch: 'hi',      accent: 'shiro',    pattern: 'patches_wh',  metal: 0 },
  { name: 'Ogon',         base: 'kin',      patch: null,      accent: null,       pattern: 'solid',       metal: 1 },
  { name: 'Platinum',     base: 'puratina', patch: null,      accent: null,       pattern: 'solid',       metal: 1 },
  { name: 'Yamabuki',     base: 'ki',       patch: null,      accent: null,       pattern: 'solid',       metal: 1 },
  { name: 'Tancho',       base: 'shiro',    patch: 'hi',      accent: null,       pattern: 'tancho',      metal: 0 },
  { name: 'Asagi',        base: 'sora',     patch: 'orenji',  accent: null,       pattern: 'sides',       metal: 0 },
  { name: 'Bekko',        base: 'shiro',    patch: 'sumi',    accent: null,       pattern: 'spots',       metal: 0 },
  { name: 'Utsuri',       base: 'sumi',     patch: 'ki',      accent: null,       pattern: 'patches',     metal: 0 },
  { name: 'Chagoi',       base: 'cha',      patch: null,      accent: null,       pattern: 'solid',       metal: 0 },
  { name: 'Soragoi',      base: 'sora',     patch: null,      accent: null,       pattern: 'solid',       metal: 0 },
  { name: 'Midorigoi',    base: 'midori',   patch: null,      accent: null,       pattern: 'solid',       metal: 0 },
  { name: 'Kujaku',       base: 'shiro',    patch: 'orenji',  accent: null,       pattern: 'patches',     metal: 0.55 },
  { name: 'Goromo',       base: 'shiro',    patch: 'hi',      accent: 'ai',       pattern: 'reticulated', metal: 0 },
  { name: 'OrenjiOgon',   base: 'orenji',   patch: null,      accent: null,       pattern: 'solid',       metal: 0.75 },
  { name: 'GinRin',       base: 'gin',      patch: 'hi',      accent: null,       pattern: 'patches',     metal: 1 },
  { name: 'ShiroUtsuri',  base: 'kuro',     patch: 'shiro',   accent: null,       pattern: 'patches',     metal: 0 },
  { name: 'KiUtsuri',     base: 'kuro',     patch: 'ki',      accent: null,       pattern: 'patches',     metal: 0 },
  { name: 'BudoSanke',    base: 'shiro',    patch: 'hi',      accent: 'sumi',     pattern: 'reticulated', metal: 0 }
];

/* ==========================================================
   CLIMA E TEMPERATURA
   ========================================================== */
const Climate = {
  waterTemp: 18,
  airTemp: 18,
  targetAirTemp: 18,
  season: 0,
  seasonTime: 0,
  yearLength: 480, // ciclo stagionale di 8 minuti reali
  lastState: 'clear',
  lastTargetState: 'clear',

  update(dt) {
    this.seasonTime += dt;
    const t = (this.seasonTime % this.yearLength) / this.yearLength;
    this.season = Math.sin(t * TAU - Math.PI / 2); // -1 inverno, +1 estate
    const baseAir = 16 + this.season * 10; // 6..26°C base
    const wxMod = { clear: 3, cloudy: -1, windy: -1, rain: -4, storm: -6, fog: -3 };
    const fromMod = wxMod[Weather.state] || 0;
    const toMod = wxMod[Weather.targetState] || 0;
    const weatherAdj = lerp(fromMod, toMod, Weather.blend);
    this.targetAirTemp = baseAir + weatherAdj;
    // Inerzia termica
    this.airTemp = lerp(this.airTemp, this.targetAirTemp, dt * 0.06);
    this.waterTemp = lerp(this.waterTemp, this.airTemp, dt * 0.02);

    // UI badge
    if (Climate.lastState !== Weather.state) {
      Climate.lastState = Weather.state;
      wxVal.textContent = {
        clear: 'sereno', cloudy: 'nuvoloso', windy: 'ventoso',
        rain: 'pioggia', storm: 'temporale', fog: 'nebbia'
      }[Weather.state] || 'sereno';
    }
    tempVal.textContent = Math.round(this.waterTemp) + '°C';
    climateBadge.classList.remove('cold','cool','ideal','warm','hot');
    if (this.waterTemp < 10) climateBadge.classList.add('cold');
    else if (this.waterTemp < 16) climateBadge.classList.add('cool');
    else if (this.waterTemp <= 24) climateBadge.classList.add('ideal');
    else if (this.waterTemp <= 28) climateBadge.classList.add('warm');
    else climateBadge.classList.add('hot');
  },

  coldFactor() { return clamp((16 - this.waterTemp) / 12, 0, 1); },
  heatFactor() { return clamp((this.waterTemp - 24) / 8, 0, 1); },
  // Depth preferita in base alla temperatura
  preferredDepthFor(adaptability) {
    const adapt = clamp(adaptability || 0.5, 0.1, 1);
    const cold = this.coldFactor() * (1 - adapt * 0.4);
    const heat = this.heatFactor() * (1 - adapt * 0.4);
    let depth = lerp(0.78, 0.18, cold);
    depth = lerp(depth, 0.45, heat * 0.7);
    return clamp(depth, 0.12, 0.92);
  },
  speedMultiplier(adaptability) {
    const adapt = clamp(adaptability || 0.5, 0.1, 1);
    const cold = this.coldFactor() * (1 - adapt * 0.4);
    const heat = this.heatFactor() * (1 - adapt * 0.4);
    return clamp(1 - cold * 0.6 - heat * 0.25, 0.35, 1.15);
  },
  hungerMultiplier(adaptability) {
    const adapt = clamp(adaptability || 0.5, 0.1, 1);
    const cold = this.coldFactor() * (1 - adapt * 0.4);
    return clamp(1 - cold * 0.7, 0.3, 1.1);
  }
};

/* GEOMETRIA */
function pondEdge(a) {
  return 1 + 0.038 * Math.sin(3 * a + 1.2)
           + 0.024 * Math.sin(5 * a + 2.7)
           + 0.014 * Math.sin(8 * a + 0.7)
           + 0.008 * Math.sin(13 * a + 4.1);
}
function buildPond() {
  const p = new Path2D();
  const N = 360;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * TAU;
    const r = pondEdge(a);
    const x = cx + rx * r * Math.cos(a);
    const y = cy + ry * r * Math.sin(a);
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  pondPath = p;
}
function insidePond(x, y, m = 1) {
  const a = Math.atan2((y - cy) / ry, (x - cx) / rx);
  const r = Math.hypot((x - cx) / rx, (y - cy) / ry);
  return r < pondEdge(a) * m;
}
function randomPondPoint(minR = 0.1, maxR = 0.78) {
  const a = rand(0, TAU);
  const r = rand(minR, maxR) * pondEdge(a);
  return { x: cx + rx * r * Math.cos(a), y: cy + ry * r * Math.sin(a) };
}

/* METEO */
const WEATHER_PRESETS = {
  clear:  { light: 1.0,  wind: 0.05, rain: 0, thunder: 0, fog: 0, tint: [0, 0, 0] },
  cloudy: { light: 0.72, wind: 0.25, rain: 0, thunder: 0, fog: 0.1, tint: [-6, -4, 2] },
  windy:  { light: 0.88, wind: 1.0,  rain: 0, thunder: 0, fog: 0, tint: [-2, 0, 4] },
  rain:   { light: 0.55, wind: 0.5,  rain: 1, thunder: 0, fog: 0.15, tint: [-14, -8, 8] },
  storm:  { light: 0.28, wind: 1.2,  rain: 1, thunder: 1, fog: 0.2, tint: [-28, -14, 12] },
  fog:    { light: 0.55, wind: 0.1,  rain: 0.05, thunder: 0, fog: 1, tint: [8, 10, 12] }
};
const WEATHER_ORDER = ['clear', 'cloudy', 'windy', 'rain', 'storm', 'fog'];

const Weather = {
  state: 'clear', targetState: 'clear', blend: 1,
  lightLevel: 1, windStrength: 0.05, windDir: rand(0, TAU),
  rainIntensity: 0, thunderLevel: 0, fogDensity: 0,
  tint: { r: 0, g: 0, b: 0 },
  nextChangeIn: rand(50, 90),
  lightning: 0, lightningTimer: rand(3, 9),
  windTargetDir: rand(0, TAU),
  rainDrops: [], windLines: [], lightningBolts: [],
  update(dt) {
    this.nextChangeIn -= dt;
    if (this.nextChangeIn <= 0) this._pickNext();
    if (this.blend < 1) this.blend = Math.min(1, this.blend + dt / 14);
    if (this.blend >= 1 && this.state !== this.targetState) this.state = this.targetState;
    const from = WEATHER_PRESETS[this.state], to = WEATHER_PRESETS[this.targetState];
    const b = this.blend;
    this.lightLevel = lerp(from.light, to.light, b);
    this.windStrength = lerp(from.wind, to.wind, b);
    this.rainIntensity = lerp(from.rain, to.rain, b);
    this.thunderLevel = lerp(from.thunder, to.thunder, b);
    this.fogDensity = lerp(from.fog, to.fog, b);
    this.tint.r = lerp(from.tint[0], to.tint[0], b);
    this.tint.g = lerp(from.tint[1], to.tint[1], b);
    this.tint.b = lerp(from.tint[2], to.tint[2], b);
    if (Math.random() < dt * 0.08) this.windTargetDir = rand(0, TAU);
    this.windDir += angDiff(this.windTargetDir, this.windDir) * dt * 0.25;
    const gust = 1 + Math.sin(time * 0.7) * 0.2 + Math.sin(time * 1.9) * 0.1;
    if (this.rainIntensity > 0.05) {
      const n = Math.floor(this.rainIntensity * 65 * dt + Math.random());
      for (let i = 0; i < n; i++) this.rainDrops.push({
        x: rand(-150, W + 150), y: rand(-250, -20),
        z: rand(400, 800), vz: rand(1000, 1600), size: rand(0.7, 1.6)
      });
    }
    for (let i = this.rainDrops.length - 1; i >= 0; i--) {
      const r = this.rainDrops[i];
      r.x += Math.cos(this.windDir) * this.windStrength * gust * 260 * dt;
      r.z -= r.vz * dt;
      r.y += (r.vz * 0.5) * dt;
      if (r.z <= 0) {
        if (insidePond(r.x, r.y, 1.02) && Math.random() < 0.55) addRipple(r.x, r.y, 0.1 + Math.random() * 0.08);
        this.rainDrops.splice(i, 1);
      } else if (r.y > H + 150) this.rainDrops.splice(i, 1);
    }
    if (this.rainDrops.length > 600) this.rainDrops.splice(0, this.rainDrops.length - 600);
    if (this.thunderLevel > 0.5) {
      this.lightningTimer -= dt;
      if (this.lightningTimer <= 0) {
        this.lightning = 1;
        this.lightningTimer = rand(4, 11);
        Sound.thunder(this.thunderLevel);
        const segs = [];
        let bx = rand(W * 0.1, W * 0.9), by = -10;
        const targetY = H * rand(0.35, 0.65);
        while (by < targetY) {
          const nx = bx + rand(-18, 18), ny = by + 20;
          segs.push({ x1: bx, y1: by, x2: nx, y2: ny });
          if (Math.random() < 0.15) {
            let brx = nx, bry = ny;
            for (let b2 = 0; b2 < 4; b2++) {
              const bnx = brx + rand(-30, 30), bny = bry + rand(10, 30);
              segs.push({ x1: brx, y1: bry, x2: bnx, y2: bny, branch: true });
              brx = bnx; bry = bny;
            }
          }
          bx = nx; by = ny;
        }
        this.lightningBolts.push({ segs, t: 0, life: 0.3 });
      }
    }
    if (this.lightning > 0) this.lightning = Math.max(0, this.lightning - dt * 4);
    for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
      this.lightningBolts[i].t += dt;
      if (this.lightningBolts[i].t >= this.lightningBolts[i].life) this.lightningBolts.splice(i, 1);
    }
    if (this.windStrength > 0.35) {
      if (Math.random() < dt * 10 * this.windStrength * gust) {
        const edge = Math.random();
        let sx, sy;
        if (edge < 0.5) { sx = Math.cos(this.windDir) < 0 ? W + 60 : -60; sy = rand(0, H); }
        else { sx = rand(0, W); sy = Math.sin(this.windDir) < 0 ? H + 60 : -60; }
        this.windLines.push({
          x: sx, y: sy,
          vx: Math.cos(this.windDir) * 420 * this.windStrength,
          vy: Math.sin(this.windDir) * 420 * this.windStrength,
          t: 0, life: 3, len: rand(50, 140)
        });
      }
    }
    for (let i = this.windLines.length - 1; i >= 0; i--) {
      const w = this.windLines[i];
      w.x += w.vx * dt; w.y += w.vy * dt; w.t += dt;
      if (w.t > w.life) this.windLines.splice(i, 1);
    }
    if (this.windLines.length > 35) this.windLines.splice(0, this.windLines.length - 35);
    Sound.updateWeatherAudio();
  },
  _pickNext() {
    const choices = WEATHER_ORDER.filter(s => s !== this.state);
    const weights = { clear: 3, cloudy: 3, windy: 2, rain: 3, storm: 2, fog: 2 };
    let total = 0;
    for (const s of choices) total += weights[s];
    let r = Math.random() * total;
    for (const s of choices) { r -= weights[s]; if (r <= 0) { this.targetState = s; break; } }
    this.blend = 0;
    this.nextChangeIn = rand(50, 120);
  },
  windSample() {
    return { x: Math.cos(this.windDir) * this.windStrength * 22, y: Math.sin(this.windDir) * this.windStrength * 22 };
  }
};

/* CORRENTI */
const Current = {
  sources: [],
  add(x, y, vx, vy, strength = 1, radius = 180) {
    this.sources.push({
      x, y, vx, vy, life: 2.8 + strength * 0.8, maxLife: 2.8 + strength * 0.8,
      radius: radius * (0.6 + strength * 0.4), strength
    });
    if (this.sources.length > 50) this.sources.shift();
  },
  sample(x, y) {
    let sx = 0, sy = 0;
    for (const s of this.sources) {
      const dx = x - s.x, dy = y - s.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > s.radius * s.radius) continue;
      const d = Math.sqrt(d2);
      const falloff = 1 - d / s.radius;
      const decay = s.life / s.maxLife;
      sx += s.vx * falloff * decay * s.strength;
      sy += s.vy * falloff * decay * s.strength;
    }
    return { x: sx, y: sy };
  },
  update(dt) {
    for (let i = this.sources.length - 1; i >= 0; i--) {
      this.sources[i].life -= dt;
      if (this.sources[i].life <= 0) this.sources.splice(i, 1);
    }
  }
};

/* FOGLIE — fisica indipendente */
class ShelterLeaf {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = rand(22, 32);
    this.rot = rand(0, TAU);
    this.wob = rand(0, TAU);
    this.vx = 0; this.vy = 0;
    this.wanderAngle = rand(0, TAU);
    this.wanderSpeed = rand(0.4, 1.0);
    this.dragging = false;
    this.personalPush = rand(4, 8);
    this.veins = [];
    const n = randInt(6, 9);
    for (let i = 0; i < n; i++) this.veins.push({ ang: (i / n) * TAU + rand(-0.1, 0.1), len: rand(0.7, 0.95) });
    this.droplets = [];
    for (let i = 0; i < 3; i++) this.droplets.push({ r: rand(0.15, 0.5), ang: rand(0, TAU), size: rand(1, 2.2) });
    this.colorShift = rand(-0.1, 0.1);
  }
  update(dt) {
    if (this.dragging) return;
    const cur = Current.sample(this.x, this.y);
    const w = Weather.windSample();
    this.wanderAngle += rand(-0.4, 0.4) * dt * this.wanderSpeed;
    this.vx += Math.cos(this.wanderAngle) * this.personalPush * dt;
    this.vy += Math.sin(this.wanderAngle) * this.personalPush * dt;
    this.vx += cur.x * 0.45 * dt;
    this.vy += cur.y * 0.45 * dt;
    this.vx += w.x * 0.85 * dt;
    this.vy += w.y * 0.85 * dt;
    for (const other of shelterLeaves) {
      if (other === this) continue;
      const dx = this.x - other.x, dy = this.y - other.y;
      const d2 = dx*dx + dy*dy;
      const minD = this.r + other.r + 60;
      if (d2 < minD * minD && d2 > 1) {
        const d = Math.sqrt(d2);
        const push = (minD - d) / minD * 140;
        this.vx += (dx / d) * push * dt;
        this.vy += (dy / d) * push * dt;
      }
    }
    this.vx *= Math.pow(0.55, dt);
    this.vy *= Math.pow(0.55, dt);
    const spd = Math.hypot(this.vx, this.vy);
    const maxSpd = 18 + Weather.windStrength * 25;
    if (spd > maxSpd) { this.vx *= maxSpd / spd; this.vy *= maxSpd / spd; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (!insidePond(this.x, this.y, 0.82)) {
      const a = Math.atan2(cy - this.y, cx - this.x);
      this.vx += Math.cos(a) * 50 * dt;
      this.vy += Math.sin(a) * 50 * dt;
      this.wanderAngle += angDiff(a, this.wanderAngle) * dt * 3;
    }
    const driftMag = Math.hypot(this.vx, this.vy);
    if (driftMag > 1) {
      const driftDir = Math.atan2(this.vy, this.vx) + Math.PI / 2;
      this.rot += angDiff(driftDir, this.rot) * Math.min(1, dt * 0.6);
    }
    this.rot += dt * 0.02;
    this.wob += dt;
  }
  draw(g) {
    const r = this.r;
    g.save();
    g.translate(this.x, this.y);
    g.rotate(this.rot);
    g.save();
    g.globalAlpha = 0.45;
    if (supportsFilter) g.filter = 'blur(5px)';
    g.fillStyle = '#04140f';
    g.beginPath(); g.ellipse(3, 4, r * 1.05, r * 0.85, 0, 0, TAU); g.fill();
    g.restore();
    const rimWob = Math.sin(this.wob * 1.8) * 0.03;
    g.beginPath();
    const N = 32;
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * TAU;
      const rr = r * (1 + rimWob + 0.07 * Math.sin(a * 5 + this.wob * 0.5) + 0.045 * Math.cos(a * 3));
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    const baseH = 105 + this.colorShift * 60;
    const grd = g.createRadialGradient(-r * 0.22, -r * 0.28, r * 0.05, 0, 0, r * 1.1);
    grd.addColorStop(0, `hsl(${baseH}, 52%, 46%)`);
    grd.addColorStop(0.5, `hsl(${baseH}, 55%, 32%)`);
    grd.addColorStop(1, `hsl(${baseH}, 58%, 16%)`);
    g.fillStyle = grd;
    g.fill();
    g.strokeStyle = 'rgba(150,200,120,0.42)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(0, 0);
    for (let i = 1; i <= 5; i++) {
      const t = i / 5;
      g.lineTo(Math.cos(this.wob * 0.3) * 1.5, Math.sin(this.wob * 0.3) * 1.5 - t * r * 0.88);
    }
    g.stroke();
    for (const v of this.veins) {
      g.strokeStyle = 'rgba(150,200,120,0.28)';
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(Math.cos(v.ang) * r * v.len, Math.sin(v.ang) * r * v.len);
      g.stroke();
    }
    g.strokeStyle = 'rgba(190,230,160,0.42)';
    g.lineWidth = 1.3;
    g.beginPath();
    const rimStart = 0.08, rimEnd = Math.PI * 1.15;
    for (let i = 0; i <= 22; i++) {
      const a = rimStart + (i / 22) * (rimEnd - rimStart);
      const rr = r * (1 + rimWob + 0.07 * Math.sin(a * 5 + this.wob * 0.5) + 0.045 * Math.cos(a * 3));
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.stroke();
    for (const d of this.droplets) {
      const dx = Math.cos(d.ang) * r * d.r;
      const dy = Math.sin(d.ang) * r * d.r;
      const dg = g.createRadialGradient(dx - d.size * 0.35, dy - d.size * 0.35, 0, dx, dy, d.size);
      dg.addColorStop(0, 'rgba(240,255,250,0.7)');
      dg.addColorStop(1, 'rgba(180,220,210,0.1)');
      g.fillStyle = dg;
      g.beginPath(); g.arc(dx, dy, d.size, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.5)';
      g.beginPath(); g.arc(dx - d.size * 0.3, dy - d.size * 0.3, d.size * 0.3, 0, TAU); g.fill();
    }
    g.restore();
  }
}
function spawnShelterLeaves() {

    const wetDist = Math.hypot(wetX, wetY) || 1;
    const wnX = wetX / wetDist, wnY = wetY / wetDist;
    const wGrad = g.createLinearGradient(
      x + wnX * size * 0.4, y + wnY * size * 0.4,
      x + wnX * size * 1.1, y + wnY * size * 1.1);
    wGrad.addColorStop(0, 'rgba(20,45,38,0)');
    wGrad.addColorStop(0.7, 'rgba(20,45,38,0.36)');
    wGrad.addColorStop(1, 'rgba(15,35,30,0.62)');

function drawStones(g) {

    let x, y, ok = false, tries = 0;

      ok = true;
      for (const s of stones) {
        if (Math.hypot(s.x - x, s.y - y) < (s.size + baseR) * 0.68) { ok = false; break; }
      }
      tries++;
    }
    if (!ok) continue;
    const ctype = Math.random();
    let hue, sat;
    if (ctype < 0.4) { hue = rand(26, 48); sat = rand(8, 22); }

        x: c.x + Math.cos(ang) * rr, y: c.y + Math.sin(ang) * rr,
        size: rad * rand(0.28, 0.45), verts: randInt(10, 14),

    const gapG = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, rad * 0.45);
    gapG.addColorStop(0, 'rgba(0,0,0,0.92)');
    gapG.addColorStop(0.5, 'rgba(0,4,6,0.72)');
    gapG.addColorStop(1, 'rgba(0,4,6,0)');
    g.fillStyle = gapG;
    g.beginPath(); g.ellipse(c.x, c.y, rad * 0.4, rad * 0.32, 0, 0, TAU); g.fill();
    for (let i = 0; i < 3; i++) {

        x: c.x + Math.cos(ang) * rr, y: c.y + Math.sin(ang) * rr,

}
function buildStatic() {
  const baseDPR = DPR;
  const desired = Math.min(baseDPR * 2.5, 4);
  const maxPixels = 18_000_000;
  const wishPixels = W * H * desired * desired;
  const staticDPR = wishPixels > maxPixels ? Math.max(1.5, Math.sqrt(maxPixels / (W * H))) : desired;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(W * staticDPR));
  c.height = Math.max(1, Math.floor(H * staticDPR));
  const g = c.getContext('2d');
  g.setTransform(staticDPR, 0, 0, staticDPR, 0, 0);
  drawGround(g);
  g.save(); g.clip(pondPath);
  drawWaterBase(g);
  drawBottom(g);
  g.restore();
  drawStones(g);
  staticLayer = c;
}

/* CAUSTICHE */
function makeCausticTile(seed, freq) {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  const d = img.data;
  const sd = seed * 1.7;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = (x / S) * TAU, v = (y / S) * TAU;
      const u2 = u + Math.sin(v * 1.7 + sd) * 0.6 + Math.cos(v * 3.1) * 0.3;
      const v2 = v + Math.sin(u * 1.9 + sd * 1.3) * 0.6 + Math.cos(u * 2.7) * 0.3;
      let n = Math.sin(u2 * freq + Math.cos(v2 * (freq - 0.5)) * 1.6) * 0.5
            + Math.sin(v2 * (freq + 0.3) + Math.cos(u2 * (freq - 0.4)) * 1.6) * 0.3
            + Math.sin((u2 + v2) * (freq - 0.6) + Math.sin(u2 * 1.3 - v2 * 1.1) * 1.4) * 0.2;
      let b = Math.pow(Math.max(0, n), 3.6) * 2.3;
      b = Math.min(1, b);
      const i = (y * S + x) * 4;
      d[i] = b * 165 | 0; d[i + 1] = b * 225 | 0; d[i + 2] = b * 255 | 0; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function causticLayer(scale, ox, oy, alpha, pattern) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.fillStyle = pattern;
  ctx.fillRect(-ox / scale - 2, -oy / scale - 2, W / scale + 4, H / scale + 4);
  ctx.restore();
}
function drawCaustics() {
  const base = Math.max(W, H);
  const lf = Weather.lightLevel;
  causticLayer(base / 520, (time * 20) % 6000, Math.sin(time * 0.4) * 32, 0.11 * lf, causticA);
  causticLayer(base / 880, (-time * 14) % 6000, (time * 9) % 6000, 0.15 * lf, causticB);
  causticLayer(base / 1350, (time * 9.5) % 6000, (-time * 7.3) % 6000, 0.09 * lf, causticC);
}

/* PIANTE */
class Plant {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.seed = rand(0, TAU);
    this.growth = rand(0.15, 0.35);
    this.growthRate = rand(0.0015, 0.004);
    this.blades = [];
    const n = type === 'reed' ? randInt(5, 10) : type === 'leaf' ? randInt(4, 8) : randInt(6, 10);
    for (let i = 0; i < n; i++) {
      this.blades.push({
        ang: rand(-1.3, 1.3),
        len: type === 'reed' ? rand(22, 58) : type === 'leaf' ? rand(10, 20) : rand(14, 30),
        w: rand(0.6, 1.6),
        hue: rand(85, 145), sat: rand(35, 65), lit: rand(18, 42),
        phase: rand(0, TAU), curve: rand(-0.3, 0.3)
      });
    }
  }
  update(dt) { this.growth = Math.min(1, this.growth + this.growthRate * dt); }
  getPoint(bladeIndex, t) {
    const b = this.blades[bladeIndex];
    if (!b) return { x: this.x, y: this.y };
    const windX = Math.cos(Weather.windDir) * Weather.windStrength;
    const windY = Math.sin(Weather.windDir) * Weather.windStrength;
    const sway = Math.sin(time * 0.9 + this.seed + b.phase) * 0.4 + windX * 3;
    const swayY = Math.cos(time * 0.7 + this.seed + b.phase) * 0.3 + windY * 3;
    const gr = this.growth;
    const len = b.len * (0.3 + gr * 0.7);
    const endX = Math.cos(b.ang - 1.57) * len * 0.9 + sway * 8;
    const endY = -len + swayY * 6;
    const ctrlX = Math.cos(b.ang - 1.57) * len * 0.45 + b.curve * 6 + sway * 4;
    const ctrlY = -len * 0.5 + swayY * 3;
    const t1 = 1 - t;
    return { x: this.x + 2 * t1 * t * ctrlX + t * t * endX, y: this.y + 2 * t1 * t * ctrlY + t * t * endY };
  }
  _drawBlade(g, b, submerged) {
    const windX = Math.cos(Weather.windDir) * Weather.windStrength;
    const windY = Math.sin(Weather.windDir) * Weather.windStrength;
    const cur = Current.sample(this.x, this.y);
    const sway = Math.sin(time * 0.9 + this.seed + b.phase) * 0.4 + windX * 3 + cur.x * 0.02;
    const swayY = Math.cos(time * 0.7 + this.seed + b.phase) * 0.3 + windY * 3 + cur.y * 0.02;
    const gr = this.growth;
    const len = b.len * (0.3 + gr * 0.7);
    const endX = Math.cos(b.ang - 1.57) * len * 0.9 + sway * 8;
    const endY = -len + swayY * 6;
    const ctrlX = Math.cos(b.ang - 1.57) * len * 0.45 + b.curve * 6 + sway * 4;
    const ctrlY = -len * 0.5 + swayY * 3;
    if (submerged) {
      g.strokeStyle = `hsla(${b.hue}, ${b.sat * 0.7}%, ${b.lit * 0.85}%, ${0.4 + gr * 0.35})`;
      g.lineWidth = b.w * (0.7 + gr * 0.5);
    } else {
      g.strokeStyle = `hsla(${b.hue}, ${b.sat + 5}%, ${b.lit + 8}%, 0.85)`;
      g.lineWidth = b.w * (0.8 + gr * 0.6);
    }
    g.beginPath();
    g.moveTo(this.x, this.y);
    g.quadraticCurveTo(this.x + ctrlX, this.y + ctrlY, this.x + endX, this.y + endY);
    g.stroke();
    if (this.type === 'leaf') {
      g.fillStyle = submerged
        ? `hsla(${b.hue}, ${b.sat * 0.8}%, ${b.lit * 0.9}%, ${0.4 + gr * 0.3})`
        : `hsla(${b.hue}, ${b.sat + 8}%, ${b.lit + 10}%, 0.7)`;
      g.beginPath();
      g.ellipse(this.x + endX, this.y + endY, 3.5, 1.8, b.ang + sway * 0.5, 0, TAU);
      g.fill();
    }
  }
  _bladeAt(b, t, sway, swayY, len) {
    const endX = Math.cos(b.ang - 1.57) * len * 0.9 + sway * 8;
    const endY = -len + swayY * 6;
    const ctrlX = Math.cos(b.ang - 1.57) * len * 0.45 + b.curve * 6 + sway * 4;
    const ctrlY = -len * 0.5 + swayY * 3;
    const t1 = 1 - t;
    return { x: this.x + 2 * t1 * t * ctrlX + t * t * endX, y: this.y + 2 * t1 * t * ctrlY + t * t * endY };
  }
  drawSubmerged(g) {
    g.save();
    g.lineCap = 'round';
    for (const b of this.blades) this._drawBlade(g, b, true);
    g.restore();
  }
  drawEmergent(g) {
    if (this.growth < 0.55) return;
    g.save();
    g.lineCap = 'round';
    for (const b of this.blades) {
      const windX = Math.cos(Weather.windDir) * Weather.windStrength;
      const windY = Math.sin(Weather.windDir) * Weather.windStrength;
      const cur = Current.sample(this.x, this.y);
      const sway = Math.sin(time * 0.9 + this.seed + b.phase) * 0.4 + windX * 3 + cur.x * 0.02;
      const swayY = Math.cos(time * 0.7 + this.seed + b.phase) * 0.3 + windY * 3 + cur.y * 0.02;
      const gr = this.growth;
      const len = b.len * (0.3 + gr * 0.7);
      const p0 = this._bladeAt(b, 0.55, sway, swayY, len);
      const p1 = this._bladeAt(b, 1.0, sway, swayY, len);
      const pc = this._bladeAt(b, 0.78, sway, swayY, len);
      g.strokeStyle = `hsla(${b.hue}, ${b.sat + 6}%, ${b.lit + 10}%, 0.88)`;
      g.lineWidth = b.w * (0.8 + gr * 0.6);
      g.beginPath();
      g.moveTo(p0.x, p0.y);
      g.quadraticCurveTo(pc.x, pc.y, p1.x, p1.y);
      g.stroke();
      if (this.type === 'reed' && gr > 0.75) {
        const dotR = 1.5 + gr * 1.5;
        g.fillStyle = `hsla(${b.hue}, ${b.sat * 0.7}%, ${b.lit + 15}%, 0.85)`;
        g.beginPath(); g.arc(p1.x, p1.y, dotR, 0, TAU); g.fill();
      }
    }
    g.restore();
  }
}

const WEAKNESSES = ['coldSensitive', 'heatSensitive', 'stormFear', 'foodPickiness', 'sleepyness', 'slowHealer', 'poorVision', 'frailBody'];
const STRENGTHS = ['coldResistant', 'heatResistant', 'stormHardy', 'foodFlexible', 'sharpSenses', 'fastHealer', 'goodVision', 'robustBody'];

function randomGenes() {

function inheritGenes(pa, pb) {
  // Scegli un genitore dominante e un peso di dominanza
  const dominantParent = Math.random() < 0.5 ? 'a' : 'b';
  const domWeight = rand(0.62, 0.82);
  const aW = dominantParent === 'a' ? domWeight : 1 - domWeight;
  const bW = 1 - aW;

  // Scegli il pattern da uno dei due genitori (o raramente mutazione)
  const patternCandidates = [pa.pattern, pb.pattern];
  const pattern = Math.random() < 0.9 ? pick(patternCandidates) : pick(KOI_VARIETIES).pattern;

  const out = {
    varietyName: Math.random() < 0.5 ? pa.varietyName : pb.varietyName,
    // Corpo — hue circolare
    bodyHue: mixHue(pa.bodyHue, pb.bodyHue, aW) + rand(-8, 8),
    bodyHue2: mixHue(pa.bodyHue2, pb.bodyHue2, aW) + rand(-10, 10),
    bodySat: clamp(lerp(pa.bodySat, pb.bodySat, bW) + rand(-5, 5), 3, 60),
    bodySat2: clamp(lerp(pa.bodySat2, pb.bodySat2, bW) + rand(-5, 5), 3, 60),
    bodyLight: clamp(lerp(pa.bodyLight, pb.bodyLight, bW * 0.6) + rand(-6, 6), 30, 99),
    bodyLight2: clamp(lerp(pa.bodyLight2, pb.bodyLight2, bW * 0.6) + rand(-6, 6), 20, 98),
    // Macchie
    patchHue: mixHue(pa.patchHue, pb.patchHue, aW) + rand(-12, 12),
    patchHue2: mixHue(pa.patchHue2, pb.patchHue2, aW) + rand(-12, 12),
    patchSat: clamp(lerp(pa.patchSat, pb.patchSat, bW) + rand(-6, 6), 30, 100),
    patchSat2: clamp(lerp(pa.patchSat2, pb.patchSat2, bW) + rand(-6, 6), 30, 100),
    patchLight: clamp(lerp(pa.patchLight, pb.patchLight, bW) + rand(-8, 8), 15, 85),
    patchLight2: clamp(lerp(pa.patchLight2, pb.patchLight2, bW) + rand(-8, 8), 15, 85),
    // Accento (Sumi/Ai di solito)
    accentHue: mixHue(pa.accentHue, pb.accentHue, aW) + rand(-10, 10),
    accentSat: clamp(lerp(pa.accentSat, pb.accentSat, bW) + rand(-5, 5), 5, 100),
    accentLight: clamp(lerp(pa.accentLight, pb.accentLight, bW) + rand(-5, 5), 5, 90),
    hasAccent: Math.random() < 0.65 ? (pa.hasAccent || pb.hasAccent) : (pa.hasAccent && pb.hasAccent),
    pattern,
    patchCount: pattern === 'solid' ? 0 : Math.max(1, Math.round(lerp(pa.patchCount, pb.patchCount, bW) + rand(-1, 1))),
    // Pinne
    finHue: mixHue(pa.finHue, pb.finHue, aW) + rand(-10, 10),
    finSat: clamp(lerp(pa.finSat, pb.finSat, bW) + rand(-6, 6), 5, 70),
    finLight: clamp(lerp(pa.finLight, pb.finLight, bW) + rand(-8, 8), 30, 95),
    // Metallico
    metal: clamp((pa.metal + pb.metal) / 2 + rand(-0.08, 0.08), 0, 1),
    // Dimensione, attività, adattabilità
    sizeGene: clamp((pa.sizeGene + pb.sizeGene) / 2 + rand(-0.08, 0.08), 0.6, 1.5),
    finSize: clamp((pa.finSize + pb.finSize) / 2 + rand(-0.06, 0.06), 0.7, 1.4),
    activityGene: clamp((pa.activityGene + pb.activityGene) / 2 + rand(-0.06, 0.06), 0.3, 1.0),
    adaptability: clamp((pa.adaptability + pb.adaptability) / 2 + rand(-0.08, 0.08), 0.1, 1.0)
  };
  // Normalizza hue
  for (const k of ['bodyHue', 'bodyHue2', 'patchHue', 'patchHue2', 'accentHue', 'finHue']) {
    out[k] = ((out[k] % 360) + 360) % 360;
  }
  return out;
}

    // Ogni tratto mescolato con peso variabile

    if (this.spookActive > 0) {

    const er = Math.hypot((this.x - cx) / rx, (this.y - cy) / ry);
    const edge = pondEdge(ea);
    if (er > edge * 0.82 && this.state !== 'sheltering') {

      const blend = Math.min(1, (er - edge * 0.82) / (edge * 0.18) * 1.5);

        targetHeading = targetHeading + angDiff(away, targetHeading) * blend * 0.75;
        if (Math.random() < 0.015) {
          this.spookActive = 0.35;
          this.spookAngle = away;
        }

    for (const o of kois) {
      if (o === this || o.state === 'dying') continue;
      const dx = this.x - o.x, dy = this.y - o.y;
      const d2 = dx*dx + dy*dy;
      const minD = (this.length + o.length) * 0.34;
      if (d2 < minD * minD && d2 > 1) {

      const minD = p.r + this.length * 0.35;
      if (d < minD && d > 1) {
        const away = Math.atan2(dy, dx);
        const blend = (minD - d) / minD;
        targetHeading = targetHeading + angDiff(away, targetHeading) * blend * 0.65;
      }

    const maxAccel = 55 * dt;
    this.speed += clamp(targetSpeed - this.speed, -maxAccel, maxAccel);
    this.x += Math.cos(this.heading) * this.speed * dt;
    this.y += Math.sin(this.heading) * this.speed * dt;
    if (this.speed > 15 && Math.random() < 0.1) {
      Current.add(
        this.x - Math.cos(this.heading) * this.length * 0.3,
        this.y - Math.sin(this.heading) * this.length * 0.3,
        Math.cos(this.heading) * this.speed * 0.5,
        Math.sin(this.heading) * this.speed * 0.5,

    const male = this.gender === 'male' ? this : other;
    if (female.fertility < 0.45) return;
    if (female.mate || male.mate) return;
    if (female.pregnancyTimer > 0 || male.pregnancyTimer > 0) return;
    female.mate = male; male.mate = female;
    female.pregnancyTimer = rand(20, 35);
    female.state = 'guarding'; male.state = 'swimming';
    if (female.courtship) female.courtship = null;
    if (male.courtship) male.courtship = null;
    female.mood = clamp(female.mood + 0.3, -1, 1);
    male.mood = clamp(male.mood + 0.3, -1, 1);
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: (this.x + other.x) / 2 + rand(-20, 20),
        y: (this.y + other.y) / 2 + rand(-20, 20),
        vx: rand(-25, 25), vy: rand(-40, -10),
