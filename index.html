      const fy = seg.p.y + seg.tg.ny * seg.w * 0.95 * side;
      const flutter = Math.sin(this.phase * 2.8 + (side > 0 ? 0 : Math.PI)) * 0.32;
      g.save();
      g.globalAlpha = 0.6 * (0.7 + this.depth * 0.3) * alpha;
      g.translate(fx, fy);
      g.rotate(this.heading + side * 1.15 + flutter);
      g.beginPath();
      g.ellipse(this.wMax * 0.55, 0, this.wMax * 0.9 * this.genes.finSize, this.wMax * 0.34, 0, 0, TAU);
      const fgd = g.createLinearGradient(0, 0, this.wMax * 1.5, 0);
      fgd.addColorStop(0, `hsla(${fH}, ${fS}%, ${fL}%, 0.85)`);
      fgd.addColorStop(1, `hsla(${fH}, ${fS}%, ${fL - 20}%, 0.05)`);
      g.fillStyle = fgd;
      g.fill();
      g.strokeStyle = `hsla(${fH}, ${fS - 10}%, ${fL - 25}%, 0.35)`;
      g.lineWidth = 0.4;
      for (let i = -2; i <= 2; i++) {
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(this.wMax * 1.35, i * this.wMax * 0.13);
        g.stroke();
      }
      g.restore();
    }
  }
  _drawAnal(g, cos, sin, spine, alpha, fH, fS, fL) {
    const idx = Math.round(0.78 * spine.length);
    const seg = spine[idx];
    g.save();
    g.globalAlpha = 0.45 * (0.7 + this.depth * 0.3) * alpha;
    const fx = seg.p.x + seg.tg.nx * seg.w * 0.9;
    const fy = seg.p.y + seg.tg.ny * seg.w * 0.9;
    g.translate(fx, fy);
    g.rotate(this.heading + 0.9);
    g.beginPath();
    g.ellipse(this.wMax * 0.4, 0, this.wMax * 0.55, this.wMax * 0.22, 0, 0, TAU);
    g.fillStyle = `hsla(${fH}, ${fS}%, ${fL}%, 0.55)`;
    g.fill();
    g.restore();
  }
  _drawHead(g, cos, sin, spine, N, alpha) {
    const eyeIdx = Math.round(0.075 * N);
    const eyeSeg = spine[eyeIdx];
    const eyeW = eyeSeg.w * 0.7;
    for (const side of [1, -1]) {
      const ex = eyeSeg.p.x + eyeSeg.tg.nx * eyeW * side;
      const ey = eyeSeg.p.y + eyeSeg.tg.ny * eyeW * side;
      const er = this.wMax * 0.18;
      g.save();
      g.globalAlpha = alpha;
      g.beginPath(); g.arc(ex, ey, er * 1.05, 0, TAU);
      g.fillStyle = 'rgba(0,0,0,.35)';
      g.fill();
      const ig = g.createRadialGradient(ex - er * 0.15, ey - er * 0.15, 1, ex, ey, er);
      ig.addColorStop(0, 'rgba(215,185,115,1)');
      ig.addColorStop(0.7, 'rgba(150,120,70,1)');
      ig.addColorStop(1, 'rgba(60,45,25,1)');
      g.beginPath(); g.arc(ex, ey, er, 0, TAU);
      g.fillStyle = ig;
      g.fill();
      g.beginPath(); g.arc(ex, ey, er * 0.48, 0, TAU);
      g.fillStyle = 'rgba(5,4,3,1)';
      g.fill();
      g.beginPath(); g.arc(ex - er * 0.35, ey - er * 0.38, er * 0.32, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.92)';
      g.fill();
      g.beginPath(); g.arc(ex + er * 0.25, ey + er * 0.28, er * 0.1, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.4)';
      g.fill();
      g.restore();
    }
    const opIdx = Math.round(0.18 * N);
    const opSeg = spine[opIdx];
    g.save();
    g.globalAlpha = 0.28 * alpha;
    g.strokeStyle = 'rgba(0,0,0,0.8)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(opSeg.p.x + opSeg.tg.nx * opSeg.w * 0.95, opSeg.p.y + opSeg.tg.ny * opSeg.w * 0.95);
    g.quadraticCurveTo(opSeg.p.x + cos * this.wMax * 0.35, opSeg.p.y + sin * this.wMax * 0.35,
                        opSeg.p.x - opSeg.tg.nx * opSeg.w * 0.95, opSeg.p.y - opSeg.tg.ny * opSeg.w * 0.95);
    g.stroke();
    g.restore();
    const mouthP = this.spine(0.005, cos, sin);
    const mouthOpen = this.mouthOpen * this.wMax * 0.26;
    g.save();
    g.globalAlpha = alpha;
    g.translate(mouthP.x, mouthP.y);
    g.rotate(this.heading);
    g.fillStyle = 'rgba(55,32,22,.9)';
    g.beginPath();
    g.ellipse(0, 0, this.wMax * 0.14 + mouthOpen, this.wMax * 0.12 + mouthOpen * 0.35, 0, 0, TAU);
    g.fill();
    g.restore();
    const headSeg = spine[0];
    g.save();
    g.globalAlpha = 0.6 * alpha;
    g.strokeStyle = 'rgba(60,40,30,.6)';
    g.lineWidth = 1.0;
    g.lineCap = 'round';
    for (const side of [-1, 1]) {
      const bx = mouthP.x + headSeg.tg.nx * side * headSeg.w * 0.5;
      const by = mouthP.y + headSeg.tg.ny * side * headSeg.w * 0.5;
      const flick = Math.sin(this.phase * 2.5 + side) * 1.5;
      g.beginPath();
      g.moveTo(bx, by);
      g.quadraticCurveTo(
        bx + cos * this.wMax * 0.55 + headSeg.tg.nx * side * headSeg.w * 0.35,
        by + sin * this.wMax * 0.55 + headSeg.tg.ny * side * headSeg.w * 0.35 + flick * 0.5,
        bx + cos * this.wMax * 1.0 + headSeg.tg.nx * side * headSeg.w * 0.15 + flick,
        by + sin * this.wMax * 1.0 + headSeg.tg.ny * side * headSeg.w * 0.15 + flick);
      g.stroke();
    }
    g.restore();
  }
}

/* INSETTI */
class Insect {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = rand(-40, 40); this.vy = rand(-40, 40);
    this.z = rand(20, 70); this.vz = rand(-10, 10);
    this.state = 'flying';
    this.landedT = 0;
    this.targetX = x + rand(-120, 120);
    this.targetY = y + rand(-120, 120);
    this.kind = pick(['dragonfly', 'fly', 'mosquito']);
    if (this.kind === 'dragonfly') {
      this.size = rand(1.4, 2.2);
      this.bodyCol = pick(['#2a8aa0', '#3a6040', '#7a4a20', '#a04030']);
      this.eyeCol = '#80c040';
      this.wingCol = 'rgba(210,235,245,0.55)';
      this.speedMul = 1.4;
    } else if (this.kind === 'fly') {
      this.size = rand(1.2, 1.8);
      this.bodyCol = '#2a2a30';
      this.eyeCol = '#a02020';
      this.wingCol = 'rgba(190,210,225,0.45)';
      this.speedMul = 1.0;
    } else {
      this.size = rand(0.9, 1.4);
      this.bodyCol = '#3a2a28';
      this.eyeCol = '#1a0a08';
      this.wingCol = 'rgba(200,200,215,0.35)';
      this.speedMul = 0.85;
    }
    this.angle = rand(0, TAU);
    this.wingPhase = rand(0, TAU);
    this.life = rand(70, 140);
    this.landCooldown = rand(8, 20);
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) return;
    this.wingPhase += dt * (this.kind === 'dragonfly' ? 42 : 85);
    if (this.state === 'flying') {
      const dx = this.targetX - this.x, dy = this.targetY - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 25 || this.life < 5) {
        this.targetX = clamp(this.x + rand(-180, 180), 0, W);
        this.targetY = clamp(this.y + rand(-180, 180), 0, H);
      }
      const want = Math.atan2(dy, dx);
      const wobble = Math.sin(time * 4 + this.x * 0.02) * 0.5;
      const accel = (this.kind === 'dragonfly' ? 180 : 130) * this.speedMul;
      this.vx += Math.cos(want + wobble) * accel * dt;
      this.vy += Math.sin(want + wobble) * accel * dt;
      this.vx *= Math.pow(0.92, dt * 60);
      this.vy *= Math.pow(0.92, dt * 60);
      this.angle = Math.atan2(this.vy, this.vx);
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.z += this.vz * dt;
      if (this.z < 25) this.vz = Math.abs(this.vz);
      if (this.z > 80) this.vz = -Math.abs(this.vz);
      const w = Weather.windSample();
      this.x += w.x * dt * 2; this.y += w.y * dt * 2;
      if (this.z < 40) {
        for (const k of kois) {
          const dk = Math.hypot(k.x - this.x, k.y - this.y);
          if (dk < 80) {
            const away = Math.atan2(this.y - k.y, this.x - k.x);
            this.vx += Math.cos(away) * 100 * dt;
            this.vy += Math.sin(away) * 100 * dt;
          }
        }
      }
      this.landCooldown -= dt;
      if (this.landCooldown <= 0) {
        let landTarget = null;
        for (const leaf of shelterLeaves) {
          if (Math.hypot(leaf.x - this.x, leaf.y - this.y) < 200) { landTarget = leaf; break; }
        }
        if (landTarget && Math.random() < 0.5) {
          this.x = landTarget.x + rand(-landTarget.r * 0.5, landTarget.r * 0.5);
          this.y = landTarget.y + rand(-landTarget.r * 0.5, landTarget.r * 0.5);
          this.state = 'landed'; this.landedT = 0; this.z = 1;
        } else if (insidePond(this.x, this.y, 0.9) && Math.random() < 0.4) {
          this.state = 'landed'; this.landedT = 0; this.z = 1;
        }
        this.landCooldown = rand(8, 20);
      }
    } else if (this.state === 'landed') {
      this.landedT += dt;
      this.x += rand(-0.3, 0.3); this.y += rand(-0.3, 0.3);
      if (this.landedT > rand(4, 11)) {
        this.state = 'flying';
        this.targetX = clamp(this.x + rand(-120, 120), 0, W);
        this.targetY = clamp(this.y + rand(-120, 120), 0, H);
        this.z = 35;
      }
    }
  }
  draw(g) {
    const alpha = Math.min(1, this.life / 4);
    const drawY = this.y - this.z;
    if (this.state === 'flying') {
      g.save();
      g.globalAlpha = 0.25 * alpha * (1 - this.z / 80);
      g.fillStyle = '#000';
      g.beginPath();
      g.ellipse(this.x, this.y, 3.5 * this.size, 1.5 * this.size, 0, 0, TAU);
      g.fill();
      g.restore();
    }
    g.save();
    g.globalAlpha = alpha;
    g.translate(this.x, drawY);
    g.rotate(this.angle);
    const s = this.size;
    const wingFlap = Math.sin(this.wingPhase) * 0.5 + 0.5;
    if (this.kind === 'dragonfly') {
      for (const side of [-1, 1]) {
        g.save();
        g.rotate(side * (Math.PI * 0.35 - 0.15 + wingFlap * 0.15));
        const wingG = g.createLinearGradient(0, 0, s * 8, 0);
        wingG.addColorStop(0, this.wingCol);
        wingG.addColorStop(1, 'rgba(180,220,240,0.15)');
        g.fillStyle = wingG;
        g.beginPath();
        g.ellipse(s * 4, 0, s * 4, s * 0.5, 0, 0, TAU);
        g.fill();
        g.strokeStyle = 'rgba(80,110,130,0.4)';
        g.lineWidth = 0.3;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(s * 8, 0); g.stroke();
        for (let i = 1; i < 5; i++) {
          g.beginPath();
          g.moveTo(s * (i * 1.5), -s * 0.35);
          g.lineTo(s * (i * 1.5), s * 0.35);
          g.stroke();
        }
        g.restore();
        g.save();
        g.rotate(side * (Math.PI * 0.7 + 0.15 + wingFlap * 0.15));
        g.fillStyle = this.wingCol;
        g.beginPath();
        g.ellipse(s * 3.5, 0, s * 3.5, s * 0.45, 0, 0, TAU);
        g.fill();
        g.restore();
      }
      g.fillStyle = this.bodyCol;
      g.beginPath(); g.ellipse(-s * 3.5, 0, s * 4, s * 0.55, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.lineWidth = 0.4;
      for (let i = 0; i < 6; i++) {
        g.beginPath();
        g.moveTo(-s * (1 + i * 1.1), -s * 0.5);
        g.lineTo(-s * (1 + i * 1.1), s * 0.5);
        g.stroke();
      }
      g.fillStyle = this.bodyCol;
      g.beginPath(); g.ellipse(0, 0, s * 1.1, s * 0.85, 0, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(s * 1.2, 0, s * 0.85, s * 0.8, 0, 0, TAU); g.fill();
      g.fillStyle = this.eyeCol;
      g.beginPath(); g.arc(s * 1.5, -s * 0.35, s * 0.5, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.5, s * 0.35, s * 0.5, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.4)';
      g.beginPath(); g.arc(s * 1.35, -s * 0.48, s * 0.14, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.35, s * 0.22, s * 0.14, 0, TAU); g.fill();
    } else if (this.kind === 'fly') {
      for (const side of [-1, 1]) {
        g.save();
        g.rotate(side * 1.2 + wingFlap * 0.15 * side);
        g.fillStyle = this.wingCol;
        g.beginPath();
        g.ellipse(s * 1.8, 0, s * 2.5, s * 0.7, 0, 0, TAU);
        g.fill();
        g.restore();
      }
      g.fillStyle = this.bodyCol;
      g.beginPath(); g.ellipse(0, 0, s * 1.8, s * 0.9, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(60,60,70,0.5)';
      g.lineWidth = 0.4;
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(-s * (0.5 + i * 0.5), -s * 0.8);
        g.lineTo(-s * (0.5 + i * 0.5), s * 0.8);
        g.stroke();
      }
      g.fillStyle = this.bodyCol;
      g.beginPath(); g.ellipse(s * 1.5, 0, s * 0.6, s * 0.7, 0, 0, TAU); g.fill();
      g.fillStyle = this.eyeCol;
      g.beginPath(); g.arc(s * 1.7, -s * 0.35, s * 0.42, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.7, s * 0.35, s * 0.42, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.4)';
      g.beginPath(); g.arc(s * 1.6, -s * 0.45, s * 0.12, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.6, s * 0.25, s * 0.12, 0, TAU); g.fill();
    } else {
      g.strokeStyle = this.bodyCol;
      g.lineWidth = 0.5;
      g.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const legLen = s * (2.5 + i * 0.3);
        for (const side of [-1, 1]) {
          g.beginPath();
          g.moveTo(0, 0);
          g.quadraticCurveTo(-s * 0.5, side * legLen * 0.6, -s * (1 + i * 0.4), side * legLen);
          g.stroke();
        }
      }
      for (const side of [-1, 1]) {
        g.save();
        g.rotate(side * 0.4 + wingFlap * 0.2 * side);
        g.fillStyle = this.wingCol;
        g.beginPath();
        g.ellipse(-s * 1.5, side * s * 0.6, s * 2, s * 0.3, 0, 0, TAU);
        g.fill();
        g.restore();
      }
      g.fillStyle = this.bodyCol;
      g.beginPath(); g.ellipse(0, 0, s * 1.6, s * 0.35, 0, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.6, 0, s * 0.35, 0, TAU); g.fill();
      g.strokeStyle = this.bodyCol;
      g.lineWidth = 0.35;
      g.beginPath();
      g.moveTo(s * 1.9, 0);
      g.lineTo(s * 3, 0);
      g.stroke();
      g.fillStyle = this.eyeCol;
      g.beginPath(); g.arc(s * 1.7, -s * 0.15, s * 0.14, 0, TAU); g.fill();
      g.beginPath(); g.arc(s * 1.7, s * 0.15, s * 0.14, 0, TAU); g.fill();
    }
    g.restore();
  }
}

/* RANE */
function pickFrogSurface(from) {
  const options = [];
  for (const plant of plants) {
    if (!plant.blades || !plant.blades.length || plant.growth < 0.5) continue;
    const bi = randInt(0, plant.blades.length - 1);
    const bt = rand(0.55, 0.92);
    const tgt = plant.getPoint(bi, bt);
    const dist = Math.hypot(tgt.x - from.x, tgt.y - from.y);
    if (dist < 380 && dist > 25) options.push({ type: 'plant', ref: plant, bladeIndex: bi, bladeT: bt, dist, weight: 1.0 });
  }
  for (const rock of rockSurface) {
    const lx = rand(-rock.r * 0.4, rock.r * 0.4);
    const ly = rand(-rock.r * 0.4, rock.r * 0.4);
    const tgt = { x: rock.x + lx, y: rock.y + ly };
    const dist = Math.hypot(tgt.x - from.x, tgt.y - from.y);
    if (dist < 380 && dist > 25) options.push({ type: 'rock', ref: rock, localX: lx, localY: ly, dist, weight: 2.2 });
  }
  for (const leaf of shelterLeaves) {
    const lx = rand(-leaf.r * 0.35, leaf.r * 0.35);
    const ly = rand(-leaf.r * 0.35, leaf.r * 0.35);
    const tgt = { x: leaf.x + lx, y: leaf.y + ly };
    const dist = Math.hypot(tgt.x - from.x, tgt.y - from.y);
    if (dist < 380 && dist > 25) options.push({ type: 'leaf', ref: leaf, localX: lx, localY: ly, dist, weight: 3 });
  }
  if (!options.length) return null;
  let total = 0;
  for (const o of options) { o.effWeight = o.weight * (1 - o.dist / 400); total += o.effWeight; }
  if (total <= 0) return options[0];
  let r = Math.random() * total;
  for (const o of options) { r -= o.effWeight; if (r <= 0) return o; }
  return options[options.length - 1];
}

class Frog {
  constructor(x, y, initialSurface) {
    this.x = x; this.y = y;
    this.size = rand(4.5, 7.5);
    this.facing = rand(0, TAU);
    this.facingTarget = this.facing;
    this.colorSet = pick([
      { base:'#5a7542', dark:'#3a5028', spot:'#263a14', belly:'#a8b888' },
      { base:'#6e6040', dark:'#453a20', spot:'#241c0e', belly:'#b8a888' },
      { base:'#5c7a4a', dark:'#37522c', spot:'#1c3010', belly:'#a0b890' },
      { base:'#7a7845', dark:'#4a4620', spot:'#2a2610', belly:'#c4c090' },
      { base:'#4a6a56', dark:'#2a4436', spot:'#142818', belly:'#a0c0b0' }
    ]);
    this.hopState = null;
    this.hopCooldown = rand(4, 14);
    this.breath = rand(0, TAU);
    this.legPhase = 0;
    this.wobble = rand(0, TAU);
    this.spots = [];
    for (let i = 0, n = randInt(5, 8); i < n; i++) {
      this.spots.push({ x: rand(-0.4, 0.4), y: rand(-0.3, 0.45), r: rand(0.05, 0.11) });
    }
    this.surfaceType = null;
    this.surfaceRef = null;
    this.localX = 0; this.localY = 0;
    this.bladeIndex = 0; this.bladeT = 0.7;
    this.fleeTimer = 0;
    if (initialSurface) this.attachTo(initialSurface);
  }
  attachTo(surface) {
    this.surfaceType = surface.type;
    this.surfaceRef = surface.ref;
    if (surface.type === 'rock' || surface.type === 'leaf') {
      this.localX = this.x - surface.ref.x;
      this.localY = this.y - surface.ref.y;
    } else if (surface.type === 'plant') {
      this.bladeIndex = surface.bladeIndex;
      this.bladeT = surface.bladeT;
    }
  }
  getSurfacePos() {
    if (this.surfaceType === 'leaf' && this.surfaceRef) {
      const cosR = Math.cos(this.surfaceRef.rot);
      const sinR = Math.sin(this.surfaceRef.rot);
      return {
        x: this.surfaceRef.x + cosR * this.localX - sinR * this.localY,
        y: this.surfaceRef.y + sinR * this.localX + cosR * this.localY
      };
    } else if (this.surfaceType === 'plant' && this.surfaceRef && this.surfaceRef.getPoint) {
      return this.surfaceRef.getPoint(this.bladeIndex, this.bladeT);
    } else if (this.surfaceType === 'rock' && this.surfaceRef) {
      return { x: this.surfaceRef.x + this.localX, y: this.surfaceRef.y + this.localY };
    }
    return { x: this.x, y: this.y };
  }
  update(dt) {
    this.breath += dt * 2.2;
    this.wobble += dt * 3;
    if (this.fleeTimer > 0) this.fleeTimer -= dt;
    const dAng = angDiff(this.facingTarget, this.facing);
    this.facing += dAng * Math.min(1, dt * 3.5);
    if (!this.hopState && this.hopCooldown > 0.3) {
      for (const k of kois) {
        if (k.state === 'dying' || k.depth > 0.55) continue;
        const d = Math.hypot(k.x - this.x, k.y - this.y);
        if (d < 50 + k.length * 0.4) {
          this.hopCooldown = Math.min(this.hopCooldown, 0.1);
          this.fleeTimer = 1.5;
          this.facingTarget = Math.atan2(this.y - k.y, this.x - k.x);
          addRipple(this.x, this.y, 0.2);
          break;
        }
      }
    }
    if (this.hopState) {
      const h = this.hopState;
      h.t += dt;
      const p = clamp(h.t / h.dur, 0, 1);
      const eased = p < 0.5 ? 16 * Math.pow(p, 5) : 1 - Math.pow(-2 * p + 2, 5) / 2;
      let targetPos;
      if (h.target.type === 'leaf') {
        const ref = h.target.ref;
        const cosR = Math.cos(ref.rot);
        const sinR = Math.sin(ref.rot);
        targetPos = {
          x: ref.x + cosR * h.target.localX - sinR * h.target.localY,
          y: ref.y + sinR * h.target.localX + cosR * h.target.localY
        };
      } else if (h.target.type === 'plant') {
        targetPos = h.target.ref.getPoint(h.target.bladeIndex, h.target.bladeT);
      } else {
        targetPos = { x: h.target.ref.x + h.target.localX, y: h.target.ref.y + h.target.localY };
      }
      this.x = lerp(h.x0, targetPos.x, eased);
      this.y = lerp(h.y0, targetPos.y, eased) - Math.sin(Math.PI * p) * h.peak;
      this.legPhase = Math.sin(Math.PI * p);
      this.facingTarget = Math.atan2(targetPos.y - h.y0, targetPos.x - h.x0);
      if (p >= 1) {
        this.x = targetPos.x; this.y = targetPos.y;
        this.attachTo(h.target);
        this.hopState = null;
        this.legPhase = 0;
        addRipple(this.x, this.y, 0.28);
      }
      return;
    }
    const pos = this.getSurfacePos();
    this.x = pos.x; this.y = pos.y;
    this.legPhase *= Math.exp(-dt * 8);
    this.hopCooldown -= dt;
    if (this.hopCooldown <= 0) {
      const target = pickFrogSurface(this);
      if (target) {
        let targetPos;
        if (target.type === 'plant') targetPos = target.ref.getPoint(target.bladeIndex, target.bladeT);
        else targetPos = { x: target.ref.x + target.localX, y: target.ref.y + target.localY };
        this.hopState = {
          t: 0, dur: rand(0.7, 1.05),
          x0: this.x, y0: this.y,
          target, peak: rand(28, 48)
        };
        this.facingTarget = Math.atan2(targetPos.y - this.y, targetPos.x - this.x);
      }
      this.hopCooldown = this.fleeTimer > 0 ? rand(2, 5) : rand(6, 18);
    }
  }
  draw(g) {
    const s = this.size;
    const p = this.hopState ? this.hopState.t / this.hopState.dur : 0;
    const jumpY = this.hopState ? Math.sin(Math.PI * p) * this.hopState.peak : 0;
    const legExt = this.legPhase;
    const breath = 1 + Math.sin(this.breath) * 0.035;
    const stretch = this.hopState ? Math.sin(Math.PI * p) : 0;
    const { base, dark, spot, belly } = this.colorSet;
    if (jumpY > 1.5) {
      g.save();
      g.globalAlpha = 0.2 * (1 - jumpY / 70);
      g.fillStyle = '#000';
      g.beginPath();
      g.ellipse(this.x, this.y, s * 1.15, s * 0.7, 0, 0, TAU);
      g.fill();
      g.restore();
    }
    g.save();
    g.translate(this.x, this.y - jumpY);
    g.rotate(this.facing + Math.PI / 2);
    g.scale(breath * (1 - stretch * 0.06), 1 * (1 + stretch * 0.15));
    for (const side of [-1, 1]) {
      const hipX = side * s * 0.45, hipY = s * 0.35;
      const kneeX = side * s * (0.85 + legExt * 0.35);
      const kneeY = s * (0.15 - legExt * 0.55);
      const ankleX = side * s * (0.75 + legExt * 0.45);
      const ankleY = s * (0.78 - legExt * 0.5);
      g.strokeStyle = dark;
      g.lineWidth = s * 0.32;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.beginPath(); g.moveTo(hipX, hipY); g.lineTo(kneeX, kneeY); g.stroke();
      g.beginPath(); g.moveTo(kneeX, kneeY); g.lineTo(ankleX, ankleY); g.stroke();
      g.fillStyle = dark;
      g.beginPath();
      g.moveTo(ankleX, ankleY);
      for (let t = 0; t < 4; t++) {
        const ang = -0.4 + t * 0.27;
        g.lineTo(ankleX + side * Math.sin(ang) * s * 0.55, ankleY + Math.cos(ang) * s * 0.55);
      }
      g.closePath();
      g.fill();
      g.strokeStyle = dark;
      g.lineWidth = s * 0.05;
      for (let t = 0; t < 3; t++) {
        const ang1 = -0.4 + t * 0.27;
        const ang2 = ang1 + 0.27;
        g.beginPath();
        g.moveTo(ankleX + side * Math.sin(ang1) * s * 0.4, ankleY + Math.cos(ang1) * s * 0.4);
        g.quadraticCurveTo(
          ankleX + side * Math.sin((ang1+ang2)/2) * s * 0.5,
          ankleY + Math.cos((ang1+ang2)/2) * s * 0.5,
          ankleX + side * Math.sin(ang2) * s * 0.4,
          ankleY + Math.cos(ang2) * s * 0.4
        );
        g.stroke();
      }
    }
    const bg = g.createRadialGradient(-s * 0.2, -s * 0.3, s * 0.1, 0, s * 0.1, s * 1.15);
    bg.addColorStop(0, base);
    bg.addColorStop(0.6, dark);
    bg.addColorStop(1, '#1a2a10');
    g.fillStyle = bg;
    g.beginPath();
    g.ellipse(0, s * 0.05, s * 0.72, s * 0.95, 0, 0, TAU);
    g.fill();
    g.globalAlpha = 0.22;
    g.fillStyle = belly;
    g.beginPath();
    g.ellipse(0, s * 0.15, s * 0.45, s * 0.72, 0, 0, TAU);
    g.fill();
    g.globalAlpha = 1;
    for (const sp of this.spots) {
      g.fillStyle = spot;
      g.globalAlpha = 0.5;
      g.beginPath();
      g.ellipse(sp.x * s * 1.35, sp.y * s * 1.55 + s * 0.1, sp.r * s * 1.3, sp.r * s * 1.5, 0, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;
    const sh = g.createRadialGradient(-s * 0.3, -s * 0.4, 0, -s * 0.3, -s * 0.4, s * 0.75);
    sh.addColorStop(0, 'rgba(255,255,255,0.14)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh;
    g.beginPath();
    g.ellipse(-s * 0.2, -s * 0.25, s * 0.35, s * 0.5, 0, 0, TAU);
    g.fill();
    const headG = g.createRadialGradient(-s * 0.1, -s * 0.75, s * 0.1, 0, -s * 0.85, s * 0.5);
    headG.addColorStop(0, base);
    headG.addColorStop(1, dark);
    g.fillStyle = headG;
    g.beginPath();
    g.moveTo(-s * 0.5, -s * 0.6);
    g.quadraticCurveTo(-s * 0.38, -s * 1.05, 0, -s * 1.1);
    g.quadraticCurveTo(s * 0.38, -s * 1.05, s * 0.5, -s * 0.6);
    g.quadraticCurveTo(0, -s * 0.45, -s * 0.5, -s * 0.6);
    g.closePath();
    g.fill();
    for (const side of [-1, 1]) {
      const ex = side * s * 0.32, ey = -s * 0.82;
      g.fillStyle = dark;
      g.beginPath(); g.arc(ex, ey, s * 0.14, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.14)';
      g.beginPath(); g.arc(ex - s * 0.02, ey - s * 0.03, s * 0.06, 0, TAU); g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.arc(-s * 0.1, -s * 0.98, s * 0.035, 0, TAU); g.fill();
    g.beginPath(); g.arc(s * 0.1, -s * 0.98, s * 0.035, 0, TAU); g.fill();
    for (const side of [-1, 1]) {
      const shX = side * s * 0.35, shY = -s * 0.4;
      const elbowX = side * s * 0.62, elbowY = -s * 0.1;
      const wristX = side * s * 0.78, wristY = s * 0.2;
      g.strokeStyle = dark;
      g.lineWidth = s * 0.18;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(shX, shY); g.lineTo(elbowX, elbowY); g.lineTo(wristX, wristY);
      g.stroke();
      for (let t = -1; t <= 1; t++) {
        g.lineWidth = s * 0.08;
        g.beginPath();
        g.moveTo(wristX, wristY);
        g.lineTo(wristX + side * s * 0.18, wristY + t * s * 0.14 + s * 0.13);
        g.stroke();
      }
    }
    g.restore();
  }
}

/* RIPPLE / SPLASH / CIBO */
function addRipple(x, y, strength = 1) {
  if (ripples.length > 100) ripples.shift();
  ripples.push({ x, y, t: 0, life: 1.4 + strength * 1.2, max: 70 + strength * 130, str: strength });
}
function spawnSplash(x, y, strength = 1) {
  const n = Math.round(8 * strength);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const spd = rand(40, 140) * strength;
    splashP.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      z: 0, vz: rand(100, 220) * strength,
      size: rand(1.2, 3) * strength, t: 0, life: rand(0.5, 0.9)
    });
  }
}
function spawnCrumbs(x, y) {
  for (let i = 0; i < 4; i++) {
    crumbs.push({ x, y, vx: rand(-15, 15), vy: rand(-15, 15), t: 0, life: 0.5, r: rand(0.6, 1.4) });
  }
}
function addFood(x, y, count) {
  for (let i = 0; i < count; i++) {
    const fx = x + rand(-34, 34), fy = y + rand(-34, 34);
    if (!insidePond(fx, fy, 0.92)) continue;
    if (foods.length > 90) foods.shift();
    const seed = rand(0, TAU);
    const vertices = 6 + randInt(0, 3);
    const shapeOffsets = [];
    for (let v = 0; v < vertices; v++) shapeOffsets.push(rand(0.75, 1.15));
    const baseHue = rand(25, 42);
    const sat = rand(38, 58);
    const light = rand(28, 44);
    foods.push({
      x: fx, y: fy, vx: rand(-4, 4), vy: rand(-4, 4),
      r: rand(1.8, 3.2), depth: 0, t: 0, wobble: rand(0, TAU),
      seed, vertices, shapeOffsets, baseHue, sat, light
    });
    addRipple(fx, fy, 0.1);
  }
  addRipple(x, y, 0.32);
}
function drawFoods() {
  for (const f of foods) {
    const sc = 1 - f.depth * 0.6;
    const al = 1 - f.depth * 0.78;
    const r = f.r * sc;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r * 3.4, 0, TAU);
    ctx.strokeStyle = `rgba(200,230,215,${0.1 * al})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.seed + f.depth * 2);
    ctx.beginPath();
    for (let v = 0; v < f.vertices; v++) {
      const a = (v / f.vertices) * TAU;
      const rr = r * f.shapeOffsets[v];
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.85;
      v ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    const grd = ctx.createRadialGradient(-r * 0.4, -r * 0.4, r * 0.05, 0, 0, r * 1.05);
    grd.addColorStop(0, `hsla(${f.baseHue}, ${f.sat}%, ${f.light + 25}%, ${al})`);
    grd.addColorStop(0.5, `hsla(${f.baseHue}, ${f.sat}%, ${f.light}%, ${al})`);
    grd.addColorStop(1, `hsla(${f.baseHue}, ${f.sat + 5}%, ${f.light - 18}%, ${al})`);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = `hsla(${f.baseHue - 10}, ${f.sat}%, ${f.light - 30}%, ${al * 0.6})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.fillStyle = `rgba(255,235,200,${0.55 * al})`;
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.28, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(255,245,220,${0.3 * al})`;
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.2, r * 0.12, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (const c of crumbs) {
    const a = 1 - c.t / c.life;
    ctx.fillStyle = `rgba(140,95,45,${a * 0.7})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
  }
}
function drawAlgaeMoss() {
  for (const a of algae) {
    if (a.amount < 0.03) continue;
    const r = a.maxR * a.amount;
    const grd = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, r);
    grd.addColorStop(0, `rgba(60,140,70,${0.55 * a.amount})`);
    grd.addColorStop(0.5, `rgba(45,110,55,${0.35 * a.amount})`);
    grd.addColorStop(1, 'rgba(40,90,50,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(a.x, a.y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(70,160,80,${0.4 * a.amount})`;
    for (let i = 0; i < 4; i++) {
      const px = a.x + Math.sin(a.seed + i * 1.7) * r * 0.4;
      const py = a.y + Math.cos(a.seed + i * 2.1) * r * 0.4;
      ctx.beginPath(); ctx.arc(px, py, r * 0.18, 0, TAU); ctx.fill();
    }
  }
  for (const m of moss) {
    if (m.amount < 0.05) continue;
    const r = m.maxR * m.amount;
    const grd = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
    grd.addColorStop(0, `rgba(80,140,60,${0.5 * m.amount})`);
    grd.addColorStop(0.6, `rgba(60,110,45,${0.3 * m.amount})`);
    grd.addColorStop(1, 'rgba(50,90,40,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, TAU); ctx.fill();
  }
}
function drawRipples() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of ripples) {
    const p = r.t / r.life;
    if (p >= 1) continue;
    const e = 1 - Math.pow(1 - p, 2.5);
    const rad = e * r.max;
    const a = Math.pow(1 - p, 2.2) * 0.65 * r.str;
    ctx.strokeStyle = `rgba(190,238,225,${a})`;
    ctx.lineWidth = Math.max(0.5, 2.6 * (1 - p) * r.str);
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
    if (p < 0.8) {
      const a2 = Math.pow(1 - p, 3.2) * 0.4 * r.str;
      ctx.strokeStyle = `rgba(215,248,238,${a2})`;
      ctx.lineWidth = Math.max(0.4, 1.6 * (1 - p));
      ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.62, 0, TAU); ctx.stroke();
    }
    if (p < 0.5) {
      const a3 = Math.pow(1 - p, 4) * 0.25 * r.str;
      ctx.strokeStyle = `rgba(240,255,250,${a3})`;
      ctx.lineWidth = Math.max(0.3, 1.0 * (1 - p));
      ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.35, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
  for (const p of splashP) {
    const a = 1 - p.t / p.life;
    ctx.fillStyle = `rgba(200,240,230,${a * 0.8})`;
    ctx.beginPath(); ctx.arc(p.x, p.y - p.z, p.size, 0, TAU); ctx.fill();
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a * 0.7;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* AUDIO */
const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null,
  ambGain: null, musicGain: null,
  noiseBuf: null, delay: null, padFilter: null,
  rainGain: null, rainFilter: null, windGain: null, windFilter: null,
  sfxOn: true, musicOn: false, started: false, _timer: null,
  init() {
    if (this.started) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.9;
    this.master.connect(c.destination);
    this.sfxBus = c.createGain();
    this.sfxBus.gain.value = this.sfxOn ? 1 : 0;
    this.sfxBus.connect(this.master);
    this.musicBus = c.createGain();
    this.musicBus.gain.value = 1;
    this.musicBus.connect(this.master);
    const len = c.sampleRate * 2;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.ambGain = c.createGain(); this.ambGain.gain.value = 0.055;
    this.ambGain.connect(this.sfxBus);
    const srcA = c.createBufferSource(); srcA.buffer = buf; srcA.loop = true;
    const lpA = c.createBiquadFilter(); lpA.type = 'lowpass'; lpA.frequency.value = 480; lpA.Q.value = 0.7;
    const gA = c.createGain(); gA.gain.value = 0.6;
    srcA.connect(lpA); lpA.connect(gA); gA.connect(this.ambGain); srcA.start();
    const lfo = c.createOscillator(); lfo.frequency.value = 0.06;
    const lfoG = c.createGain(); lfoG.gain.value = 220;
    lfo.connect(lfoG); lfoG.connect(lpA.frequency); lfo.start();
    this.rainGain = c.createGain(); this.rainGain.gain.value = 0;
    this.rainGain.connect(this.sfxBus);
    const rainSrc = c.createBufferSource(); rainSrc.buffer = buf; rainSrc.loop = true;
    this.rainFilter = c.createBiquadFilter(); this.rainFilter.type = 'highpass';
    this.rainFilter.frequency.value = 1800;
    rainSrc.connect(this.rainFilter); this.rainFilter.connect(this.rainGain); rainSrc.start();
    this.windGain = c.createGain(); this.windGain.gain.value = 0;
    this.windGain.connect(this.sfxBus);
    const windSrc = c.createBufferSource(); windSrc.buffer = buf; windSrc.loop = true;
    this.windFilter = c.createBiquadFilter(); this.windFilter.type = 'bandpass';
    this.windFilter.frequency.value = 400; this.windFilter.Q.value = 0.6;
    windSrc.connect(this.windFilter); this.windFilter.connect(this.windGain); windSrc.start();
    const wlfo = c.createOscillator(); wlfo.frequency.value = 0.15;
    const wlfoG = c.createGain(); wlfoG.gain.value = 200;
    wlfo.connect(wlfoG); wlfoG.connect(this.windFilter.frequency); wlfo.start();
    this.musicGain = c.createGain(); this.musicGain.gain.value = 0;
    this.musicGain.connect(this.musicBus);
    this.delay = c.createDelay(1.5); this.delay.delayTime.value = 0.5;
    const fb = c.createGain(); fb.gain.value = 0.42;
    const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
    this.delay.connect(fb); fb.connect(dlp); dlp.connect(this.delay);
    this.delay.connect(this.musicGain);
    this.padFilter = c.createBiquadFilter();
    this.padFilter.type = 'lowpass'; this.padFilter.frequency.value = 900; this.padFilter.Q.value = 0.6;
    this.padFilter.connect(this.musicGain);
    this.started = true;
    this.resume();
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  updateWeatherAudio() {
    if (!this.started) return;
    const t = this.ctx.currentTime;
    const rainVol = this.sfxOn ? Weather.rainIntensity * 0.11 : 0;
    const windVol = this.sfxOn ? Weather.windStrength * 0.06 : 0;
    this.rainGain.gain.setTargetAtTime(rainVol, t, 0.8);
    this.windGain.gain.setTargetAtTime(windVol, t, 0.8);
  },
  thunder(intensity = 1) {
    if (!this.started || !this.sfxOn) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(500, t);
    lp.frequency.exponentialRampToValueAtTime(90, t + 2.5);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.28 * intensity, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + 3.2);
    s.connect(lp); lp.connect(g); g.connect(this.sfxBus);
    s.start(t); s.stop(t + 3.4);
  },
  pluck(freq, when, dur, vol) {
    const c = this.ctx;
    const o1 = c.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.003;
    const o3 = c.createOscillator(); o3.type = 'sine'; o3.frequency.value = freq * 0.5;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    const g3 = c.createGain(); g3.gain.value = 0.28;
    o1.connect(g); o3.connect(g3); g3.connect(g);
    g.connect(this.musicGain); g.connect(this.delay);
    o1.start(when); o2.start(when); o3.start(when);
    o1.stop(when + dur + 0.2); o2.stop(when + dur + 0.2); o3.stop(when + dur + 0.2);
  },
  playPad(freqs, when, duration) {
    const c = this.ctx;
    const padG = c.createGain();
    padG.gain.setValueAtTime(0.0001, when);
    padG.gain.linearRampToValueAtTime(0.055, when + duration * 0.35);
    padG.gain.linearRampToValueAtTime(0.0001, when + duration);
    padG.connect(this.padFilter);
    freqs.forEach(f => {
      for (let v = 0; v < 2; v++) {
        const osc = c.createOscillator();
        osc.type = v === 0 ? 'sine' : 'triangle';
        osc.frequency.value = f;
        osc.detune.value = v === 0 ? rand(-6, -2) : rand(2, 6);
        const vg = c.createGain();
        vg.gain.value = 0.5 / (freqs.length * 2);
        osc.connect(vg); vg.connect(padG);
        osc.start(when); osc.stop(when + duration + 0.2);
      }
    });
    const lfo = c.createOscillator(); lfo.frequency.value = 0.09;
    const lg = c.createGain(); lg.gain.value = 180;
    lfo.connect(lg); lg.connect(this.padFilter.frequency);
    lfo.start(when); lfo.stop(when + duration + 0.2);
  },
  schedule() {
    if (!this.musicOn || !this.started) return;
    const c = this.ctx;
    const chords = [[0, 4, 7, 11], [-3, 0, 4, 7], [5, 9, 12, 16], [-5, -1, 2, 7]];
    const root = 174.61;
    const ci = (this._chordIdx | 0) % chords.length;
    const chord = chords[ci];
    this._chordIdx = (ci + 1) % chords.length;
    const padFreqs = chord.map(s => root * Math.pow(2, s / 12));
    const padDur = rand(11, 16);
    this.playPad(padFreqs, c.currentTime + 0.05, padDur);
    const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
    const melRoot = 174.61 * 2;
    const nNotes = 2 + ((Math.random() * 3) | 0);
    for (let i = 0; i < nNotes; i++) {
      const n = scale[(Math.random() * scale.length) | 0];
      const freq = melRoot * Math.pow(2, n / 12);
      const when = c.currentTime + 1 + i * rand(2.4, 4.2);
      this.pluck(freq, when, rand(2.5, 4.5), 0.055);
    }
    this._timer = setTimeout(() => this.schedule(), padDur * 1000 * 0.9);
  },
  setSfx(on) {
    this.sfxOn = on;
    if (!this.started) return;
    const t = this.ctx.currentTime;
    this.sfxBus.gain.cancelScheduledValues(t);
    this.sfxBus.gain.setValueAtTime(this.sfxBus.gain.value, t);
    this.sfxBus.gain.linearRampToValueAtTime(on ? 1 : 0, t + 0.4);
    this.rainGain.gain.cancelScheduledValues(t);
    this.rainGain.gain.setValueAtTime(this.rainGain.gain.value, t);
    this.rainGain.gain.linearRampToValueAtTime(on ? Weather.rainIntensity * 0.11 : 0, t + 0.4);
    this.windGain.gain.cancelScheduledValues(t);
    this.windGain.gain.setValueAtTime(this.windGain.gain.value, t);
    this.windGain.gain.linearRampToValueAtTime(on ? Weather.windStrength * 0.06 : 0, t + 0.4);
  },
  setMusic(on) {
    this.musicOn = on;
    if (!this.started) return;
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
    this.musicGain.gain.linearRampToValueAtTime(on ? 0.36 : 0.0, t + 1.4);
    if (on) {
      if (this._timer) clearTimeout(this._timer);
      this.schedule();
    } else if (this._timer) {
      clearTimeout(this._timer);
      this._timer = null;
    }
  }
};

/* INTERAZIONE */
function onTap(wx, wy) {
  Sound.init();
  if (!insidePond(wx, wy, 1.02)) return;
  addRipple(wx, wy, 1.2);
  spawnSplash(wx, wy, 1);
  Current.add(wx, wy, 0, 0, 2.5, 220);
  for (const f of foods) {
    const dx = f.x - wx, dy = f.y - wy;
    const d = Math.hypot(dx, dy);
    if (d < 220 && d > 1) {
      const ff = (220 - d) / 220 * 120;
      f.vx += (dx / d) * ff;
      f.vy += (dy / d) * ff;
    }
  }
  for (const ins of insects) {
    if (ins.state !== 'landed') continue;
    if (Math.hypot(ins.x - wx, ins.y - wy) < 150) { ins.state = 'flying'; ins.z = 40; }
  }
  if (feedMode) addFood(wx, wy, 4 + randInt(0, 4));
  const SPOOK_R = 130, CURIOSITY_R = 500;
  for (const k of kois) {
    if (k.state === 'dying') continue;
    const d = Math.hypot(k.x - wx, k.y - wy);
    if (feedMode) {
      if (d < CURIOSITY_R) {
        k.curiousTarget = { x: wx, y: wy };
        k.curiousTimer = Math.max(k.curiousTimer, rand(1.5, 3));
      }
    } else {
      if (d < SPOOK_R) {
        k.spookActive = rand(0.5, 1.1);
        k.spookAngle = Math.atan2(k.y - wy, k.x - wx) + rand(-0.4, 0.4);
        k.mood = clamp(k.mood - 0.2, -1, 1);
      } else if (d < CURIOSITY_R && Math.random() < 0.6) {
        k.curiousTarget = { x: wx, y: wy };
        k.curiousTimer = Math.max(k.curiousTimer, rand(2, 4));
      }
    }
  }
  hideHint();
}
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  const h = document.getElementById('hint');
  if (h) { h.style.opacity = '0'; setTimeout(() => h.remove(), 1600); }
}
function hitTestLeaf(sx, sy) {
  const w = screenToWorld(sx, sy);
  for (const l of shelterLeaves) {
    if (Math.hypot(w.x - l.x, w.y - l.y) < l.r * 1.08) return l;
  }
  return null;
}

function beginPinch() {
  const pts = [...pointers.values()];
  if (pts.length < 2) return;
  const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
  const dist = Math.hypot(dx, dy) || 1;
  const cxp = (pts[0].x + pts[1].x) / 2, cyp = (pts[0].y + pts[1].y) / 2;
  pinchStart = { dist, startZoom: view.zoom, worldBefore: screenToWorld(cxp, cyp) };
  if (draggedPad) { draggedPad.dragging = false; draggedPad = null; }
  tapStart = null; panStart = null;
}
function updatePinch() {
  if (!pinchStart || pointers.size < 2) return;
  const pts = [...pointers.values()];
  const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
  const dist = Math.hypot(dx, dy) || 1;
  const cxp = (pts[0].x + pts[1].x) / 2, cyp = (pts[0].y + pts[1].y) / 2;
  const newZoom = clamp(pinchStart.startZoom * (dist / pinchStart.dist), 1, MAX_ZOOM);
  view.zoom = newZoom;
  view.x = pinchStart.worldBefore.x - (cxp - W/2) / newZoom;
  view.y = pinchStart.worldBefore.y - (cyp - H/2) / newZoom;
  view.targetZoom = newZoom;
  view.targetX = view.x; view.targetY = view.y;
  clampView();
  zoomBadge.textContent = newZoom.toFixed(1) + '×';
  zoomBadge.classList.add('show');
  if (zoomBadgeTimer) clearTimeout(zoomBadgeTimer);
  zoomBadgeTimer = setTimeout(() => zoomBadge.classList.remove('show'), 800);
}

window.addEventListener('pointerdown', (e) => {
  if (e.target !== cv) return;
  cv.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  Sound.init();
  if (pointers.size === 2) { beginPinch(); return; }
  if (pointers.size === 1) {
    const l = hitTestLeaf(e.clientX, e.clientY);
    if (l) {
      draggedPad = l; l.dragging = true;
      const w = screenToWorld(e.clientX, e.clientY);
      addRipple(w.x, w.y, 0.4);
      tapStart = null;
      return;
    }
    tapStart = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, moved: false };
    panStart = null;
  }
}, { passive: false });

window.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2 && pinchStart) { updatePinch(); return; }
  if (draggedPad && pointers.size === 1) {
    const w = screenToWorld(e.clientX, e.clientY);
    draggedPad.x = w.x; draggedPad.y = w.y;
    draggedPad.vx = 0; draggedPad.vy = 0;
    if (Math.random() < 0.3) addRipple(w.x, w.y, 0.3);
    Current.add(w.x, w.y, 0, 0, 0.8, 80);
    return;
  }
  if (tapStart && tapStart.id === e.pointerId) {
    const dx = e.clientX - tapStart.x, dy = e.clientY - tapStart.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 8) {
      tapStart.moved = true;
      if (view.zoom > 1.05) {
        if (!panStart) panStart = { x: tapStart.x, y: tapStart.y, viewX: view.x, viewY: view.y };
        const wdx = (e.clientX - panStart.x) / view.zoom;
        const wdy = (e.clientY - panStart.y) / view.zoom;
        view.x = panStart.viewX - wdx;
        view.y = panStart.viewY - wdy;
        view.targetX = view.x; view.targetY = view.y;
        clampView();
      } else {
        if (dist > 20) {
          const w = screenToWorld(e.clientX, e.clientY);
          if (insidePond(w.x, w.y)) {
            addRipple(w.x, w.y, 0.5);
            if (Math.random() < 0.4) Current.add(w.x, w.y, dx * 2, dy * 2, 0.8, 100);
          }
          tapStart.x = e.clientX;
          tapStart.y = e.clientY;
        }
      }
    }
  }
}, { passive: false });

function pointerEnd(e) {
  const wasTracked = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (draggedPad) { draggedPad.dragging = false; draggedPad = null; }
  panStart = null;
  if (wasTracked && tapStart && tapStart.id === e.pointerId && !tapStart.moved) {
    const now = performance.now();
    const dt = now - lastTapTime;
    const isDouble = dt < 320 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40;
    lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY;
    if (isDouble && view.zoom > 1.05) {
      view.targetZoom = 1; view.targetX = cx; view.targetY = cy;
    } else {
      const w = screenToWorld(e.clientX, e.clientY);
      onTap(w.x, w.y);
    }
  }
  tapStart = null;
}
window.addEventListener('pointerup', pointerEnd, { passive: true });
window.addEventListener('pointercancel', pointerEnd, { passive: true });

window.addEventListener('wheel', (e) => {
  if (e.target !== cv) return;
  e.preventDefault();
  Sound.init();
  const w = screenToWorld(e.clientX, e.clientY);
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const newZoom = clamp(view.targetZoom * factor, 1, MAX_ZOOM);
  view.targetZoom = newZoom;
  view.targetX = w.x - (e.clientX - W/2) / newZoom;
  view.targetY = w.y - (e.clientY - H/2) / newZoom;
  const halfW = W / (2 * view.targetZoom), halfH = H / (2 * view.targetZoom);
  const minX = cx - rx + halfW, maxX = cx + rx - halfW;
  const minY = cy - ry + halfH, maxY = cy + ry - halfH;
  view.targetX = minX >= maxX ? cx : clamp(view.targetX, minX, maxX);
  view.targetY = minY >= maxY ? cy : clamp(view.targetY, minY, maxY);
  if (newZoom <= 1.05) { view.targetX = cx; view.targetY = cy; view.targetZoom = 1; }
}, { passive: false });

/* RENDER */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#020806';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(view.zoom, view.zoom);
  ctx.translate(-view.x, -view.y);
  ctx.drawImage(staticLayer, 0, 0, W, H);
  for (const p of plants) if (inView(p.x, p.y, 60)) p.drawSubmerged(ctx);
  drawAlgaeMoss();
  if (Weather.tint.r !== 0 || Weather.tint.g !== 0 || Weather.tint.b !== 0) {
    ctx.save();
    const tr = clamp(-Weather.tint.r, 0, 255);
    const tg = clamp(-Weather.tint.g, 0, 255);
    const tb = clamp(-Weather.tint.b, 0, 255);
    const a = (Math.abs(Weather.tint.r) + Math.abs(Weather.tint.g) + Math.abs(Weather.tint.b)) / 220;
    ctx.fillStyle = `rgba(${tr},${tg},${tb},${a})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  const sorted = kois.slice().sort((a, b) => a.depth - b.depth);
  for (const k of sorted) if (inView(k.x, k.y, k.length)) k.draw(ctx);
  ctx.save(); ctx.clip(pondPath); drawCaustics(); ctx.restore();
  ctx.save();
  ctx.clip(pondPath);
  ctx.globalCompositeOperation = 'lighter';
  const waveAmp = 0.018 + Weather.windStrength * 0.022;
  for (let i = 0; i < 5; i++) {
    const y = cy + Math.sin(time * 0.14 + i * 1.4) * ry * 0.7;
    const g = ctx.createLinearGradient(0, y - 28, 0, y + 28);
    g.addColorStop(0, 'rgba(180,225,215,0)');
    g.addColorStop(0.5, `rgba(180,225,215,${waveAmp + 0.008 * Math.sin(time * 0.35 + i * 1.7)})`);
    g.addColorStop(1, 'rgba(180,225,215,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 28, W, 56);
  }
  for (let i = 0; i < 22; i++) {
    const seed = i * 7.3;
    const px = cx + Math.sin(seed * 1.7 + time * 0.4) * rx * 0.85;
    const py = cy + Math.cos(seed * 2.3 + time * 0.3) * ry * 0.85;
    if (!insidePond(px, py, 0.94)) continue;
    const ph = Math.sin(time * 2.8 + seed * 5) * 0.5 + 0.5;
    if (ph < 0.75) continue;
    const alpha = (ph - 0.75) / 0.25 * 0.35 * Weather.lightLevel;
    const r = 1.2 + Math.sin(seed * 3) * 0.8;
    ctx.fillStyle = `rgba(220,255,245,${alpha})`;
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
  }
  for (const leaf of shelterLeaves) {
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = 'rgba(200,235,220,0.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(leaf.x, leaf.y, leaf.r * 1.02, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  for (const p of plants) if (inView(p.x, p.y, 80)) p.drawEmergent(ctx);
  for (const e of eggs) if (inView(e.x, e.y, 20)) {
    const pulse = 0.5 + Math.sin(time * 3 + e.t * 2) * 0.3;
    ctx.save();
    ctx.globalAlpha = 0.8;
    const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 5);
    grd.addColorStop(0, `rgba(255,235,220,${0.7 + pulse * 0.2})`);
    grd.addColorStop(1, 'rgba(200,180,160,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (const leaf of shelterLeaves) if (inView(leaf.x, leaf.y, leaf.r + 20)) leaf.draw(ctx);
  drawFoods();
  drawRipples();
  drawParticles();
  for (const f of frogs) if (inView(f.x, f.y, 20)) f.draw(ctx);
  for (const ins of insects) if (inView(ins.x, ins.y, 20)) ins.draw(ctx);
  ctx.save();
  ctx.clip(pondPath);
  ctx.globalCompositeOperation = 'lighter';
  const sx = cx + Math.sin(time * 0.09) * rx * 0.5;
  const sy = cy + Math.cos(time * 0.07) * ry * 0.5;
  const sunR = Math.max(W, H) * 0.55;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sunR);
  const sgStr = 0.05 * Weather.lightLevel;
  sg.addColorStop(0, `rgba(180,235,215,${sgStr})`);
  sg.addColorStop(0.5, `rgba(150,220,200,${sgStr * 0.45})`);
  sg.addColorStop(1, 'rgba(150,220,200,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  if (Weather.windLines.length > 0) {
    ctx.save();
    ctx.clip(pondPath);
    ctx.strokeStyle = 'rgba(220,240,235,0.18)';
    ctx.lineWidth = 1;
    for (const w of Weather.windLines) {
      const a = Math.sin((w.t / w.life) * Math.PI);
      ctx.globalAlpha = a * 0.5;
      ctx.beginPath();
      ctx.moveTo(w.x, w.y);
      ctx.lineTo(w.x - Math.cos(Weather.windDir) * w.len, w.y - Math.sin(Weather.windDir) * w.len);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (Weather.rainDrops.length > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(200,220,240,0.55)';
    ctx.lineCap = 'round';
    for (const r of Weather.rainDrops) {
      const alpha = clamp(1 - r.z / 800, 0.15, 1);
      ctx.globalAlpha = alpha * 0.7;
      ctx.lineWidth = r.size;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - Math.cos(Weather.windDir) * 5 * Weather.windStrength, r.y - 16);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (Weather.lightning > 0.02) {
    ctx.fillStyle = `rgba(240,245,255,${Weather.lightning * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
  for (const bolt of Weather.lightningBolts) {
    const life = bolt.t / bolt.life;
    const alpha = (1 - life) * 0.9;
    ctx.save();
    ctx.strokeStyle = `rgba(230,240,255,${alpha})`;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(180,210,255,0.8)';
    ctx.shadowBlur = 15;
    for (const s of bolt.segs) {
      ctx.lineWidth = s.branch ? 1.2 : 2.5;
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (Weather.fogDensity > 0.05) {
    const fogA = Weather.fogDensity;
    const fg = ctx.createLinearGradient(0, 0, 0, H);
    fg.addColorStop(0, `rgba(200,215,220,${fogA * 0.25})`);
    fg.addColorStop(0.5, `rgba(190,205,215,${fogA * 0.4})`);
    fg.addColorStop(1, `rgba(180,200,210,${fogA * 0.3})`);
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);
  }
  if (Weather.lightLevel < 0.9) {
    const darkness = (1 - Weather.lightLevel) * 0.35;
    ctx.fillStyle = `rgba(8,12,20,${darkness})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

/* UPDATE */
function update(dt) {
  worldAge += dt;
  Weather.update(dt);
  Climate.update(dt);
  Current.update(dt);
  updateView(dt);
  if (autoFeed) {
    autoFeedTimer -= dt;
    if (autoFeedTimer <= 0) {
      autoFeedTimer = rand(14, 22);
      const p = randomPondPoint(0.25, 0.7);
      addFood(p.x, p.y, 4 + randInt(0, 3));
    }
  }
  for (const k of kois) k.update(dt);
  for (const f of frogs) f.update(dt);
  for (const ins of insects) ins.update(dt);
  for (const p of plants) p.update(dt);
  for (const leaf of shelterLeaves) leaf.update(dt);
  for (let i = 0; i < kois.length; i++) {
    for (let j = i + 1; j < kois.length; j++) {
      const a = kois[i], b = kois[j];
      if (a.state === 'dying' || b.state === 'dying') continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (a.gender !== b.gender && a.isAdult && b.isAdult && d < 90) {
        const female = a.gender === 'female' ? a : b;
        const male = a.gender === 'male' ? a : b;
        if (!female.mate && !male.mate && !female.pregnancyTimer &&
            female.fertility > 0.45 && Math.random() < 0.012) {
          male.tryMate(female);
        }
      }
      if (d < 80) {
        if (Math.random() < 0.004) {
          if (Math.random() < 0.5) a.tryFight(b);
          else b.tryFight(a);
        }
      }
    }
  }
  for (const k of kois) if (k.recentHostile && Math.random() < 0.001) k.recentHostile = null;
  for (let i = kois.length - 1; i >= 0; i--) {
    const k = kois[i];
    if (k.state === 'dying' && k._dyingTime > 4) {
      kois.splice(i, 1);
      if (k.mate) { k.mate.mate = null; k.mate = null; }
    }
  }
  for (let i = eggs.length - 1; i >= 0; i--) {
    const e = eggs[i];
    e.t += dt;
    if (e.t > e.hatchTime) {
      if (kois.length < 28) {
        const pa = e.parentA ? e.parentA.genes : randomGenes();
        const pb = e.parentB.genes;
        const genes = inheritGenes(pa, pb);
        const pPA = e.parentA ? e.parentA.personality : randomPersonality();
        const pPB = e.parentB.personality;
        const pers = inheritPersonality(pPA, pPB);
        const soulA = e.parentA ? e.parentA.soul : rand(-1, 1);
        const soulB = e.parentB.soul;
        const soul = inheritSoul(soulA, soulB);
        const child = new Koi(e.x, e.y, genes, pers, soul, 0.5, e.generation);
        child.parents = [e.parentA, e.parentB].filter(Boolean);
        if (e.parentA) e.parentA.children.push(child);
        if (e.parentB) e.parentB.children.push(child);
        kois.push(child);
        addRipple(e.x, e.y, 0.4);
        for (let p = 0; p < 6; p++) {
          particles.push({
            x: e.x, y: e.y, vx: rand(-20, 20), vy: rand(-20, 20),
            t: 0, life: 1.5, color: '#ffe8a0', size: rand(1.5, 2.5)
          });
        }
      }
      eggs.splice(i, 1);
    }
  }
  for (const a of algae) { a.amount = clamp(a.amount + dt / 90, 0, 1); a.seed += dt * 0.3; }
  if (algae.length < 30 && Math.random() < dt * 0.08) {
    const p = randomPondPoint(0.1, 0.9);
    algae.push({ x: p.x, y: p.y, amount: rand(0.1, 0.3), maxR: rand(22, 48), seed: rand(0, TAU) });
  }
  for (const m of moss) m.amount = clamp(m.amount + dt / 120, 0, 1);
  if (moss.length < 15 && Math.random() < dt * 0.05) {
    const p = randomPondPoint(0.05, 0.95);
    moss.push({ x: p.x, y: p.y, amount: rand(0.1, 0.3), maxR: rand(18, 36) });
  }
  if (insects.length < 3 && Math.random() < dt * 0.06) {
    const p = randomPondPoint(0.1, 0.9);
    insects.push(new Insect(p.x, p.y));
  }
  for (let i = insects.length - 1; i >= 0; i--) if (insects[i].life <= 0) insects.splice(i, 1);
  if (frogs.length < 3 && Math.random() < dt * 0.018) {
    const surfaces = [];
    for (const leaf of shelterLeaves) surfaces.push({ type: 'leaf', ref: leaf, localX: 0, localY: 0 });
    for (const plant of plants) {
      if (plant.blades && plant.blades.length && plant.growth > 0.5) {
        const bi = randInt(0, plant.blades.length - 1);
        surfaces.push({ type: 'plant', ref: plant, bladeIndex: bi, bladeT: rand(0.6, 0.85) });
      }
    }
    for (const rock of rockSurface) surfaces.push({ type: 'rock', ref: rock, localX: 0, localY: 0 });
    if (surfaces.length) {
      const s = pick(surfaces);
      let p;
      if (s.type === 'plant') p = s.ref.getPoint(s.bladeIndex, s.bladeT);
      else p = { x: s.ref.x, y: s.ref.y };
      frogs.push(new Frog(p.x, p.y, s));
    }
  }
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    f.t += dt;
    if (f.t > 3) f.depth += dt * 0.06;
    if (f.depth >= 1) { foods.splice(i, 1); continue; }
    const cur = Current.sample(f.x, f.y);
    const w = Weather.windSample();
    f.vx += (cur.x * 0.4 + w.x * 0.3) * dt;
    f.vy += (cur.y * 0.4 + w.y * 0.3) * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= 0.97; f.vy *= 0.97;
    f.vx += Math.sin(time * 1.4 + f.wobble) * 2.2 * dt;
    f.vy += Math.cos(time * 1.1 + f.wobble * 1.3) * 2.2 * dt;
    if (!insidePond(f.x, f.y, 0.96)) {
      const a = Math.atan2(cy - f.y, cx - f.x);
      f.vx += Math.cos(a) * 22 * dt;
      f.vy += Math.sin(a) * 22 * dt;
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].t += dt;
    if (ripples[i].t >= ripples[i].life) ripples.splice(i, 1);
  }
  for (let i = crumbs.length - 1; i >= 0; i--) {
    const c = crumbs[i];
    c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt;
    c.vx *= 0.94; c.vy *= 0.94;
    if (c.t >= c.life) crumbs.splice(i, 1);
  }
  for (let i = splashP.length - 1; i >= 0; i--) {
    const p = splashP[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vz -= 500 * dt; p.z += p.vz * dt;
    if (p.z <= 0) { addRipple(p.x, p.y, 0.15); splashP.splice(i, 1); continue; }
    if (p.t >= p.life) splashP.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 10 * dt;
    if (p.t >= p.life) particles.splice(i, 1);
  }
}
function loop(ts) {
  if (!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  dt = Math.min(dt, 0.05);
  time += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* SETUP */
function spawnInitialKoi() {
  kois = [];
  const area = (W * H) / (1280 * 720);
  const count = clamp(Math.round(12 * Math.sqrt(area)), 8, 16);
  for (let i = 0; i < count; i++) {
    const p = randomPondPoint(0.1, 0.72);
    const genes = randomGenes();
    const pers = randomPersonality();
    const soul = rand(-1, 1);
    const ageRand = Math.random();
    let age, gen;
    if (ageRand < 0.15) { age = rand(20, 60); gen = randInt(1, 2); }
    else if (ageRand < 0.85) { age = rand(180, 400); gen = randInt(1, 3); }
    else { age = rand(430, 560); gen = randInt(1, 2); }
    const k = new Koi(p.x, p.y, genes, pers, soul, age, gen);
    k.hunger = rand(0.2, 0.7);
    k.energy = rand(0.5, 1);
    kois.push(k);
  }
  const adults = kois.filter(k => k.isAdult);
  const males = adults.filter(k => k.gender === 'male');
  const females = adults.filter(k => k.gender === 'female');
  if (!males.length) {
    const p = randomPondPoint(0.1, 0.72);
    const k = new Koi(p.x, p.y, randomGenes(), randomPersonality(), rand(-1, 1), rand(200, 350), 1);
    k.gender = 'male'; k.energy = 0.9; k.hunger = 0.3;
    kois.push(k);
  }
  if (!females.length) {
    const p = randomPondPoint(0.1, 0.72);
    const k = new Koi(p.x, p.y, randomGenes(), randomPersonality(), rand(-1, 1), rand(200, 350), 1);
    k.gender = 'female'; k.energy = 0.9; k.hunger = 0.3;
    kois.push(k);
  }
}
function spawnAlgaeMoss() {
  algae = []; moss = [];
  for (let i = 0; i < 12; i++) {
    const p = randomPondPoint(0.15, 0.9);
    algae.push({ x: p.x, y: p.y, amount: rand(0.2, 0.6), maxR: rand(22, 48), seed: rand(0, TAU) });
  }
  for (let i = 0; i < 6; i++) {
    const p = randomPondPoint(0.05, 0.95);
    moss.push({ x: p.x, y: p.y, amount: rand(0.2, 0.5), maxR: rand(18, 36) });
  }
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.max(1, Math.floor(W * DPR));
  cv.height = Math.max(1, Math.floor(H * DPR));
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H / 2;
  rx = W * 0.465; ry = H * 0.465;
  buildPond();
  spawnCaves();
  spawnShelterLeaves();
  buildStatic();
  if (!kois.length) {
    spawnInitialKoi();
    spawnAlgaeMoss();
    spawnPlants();
  } else {
    spawnShelterLeaves();
    spawnPlants();
    for (const a of algae) { const p = randomPondPoint(0.15, 0.9); a.x = p.x; a.y = p.y; }
    for (const m of moss) { const p = randomPondPoint(0.05, 0.95); m.x = p.x; m.y = p.y; }
  }
  foods = []; ripples = []; splashP = []; crumbs = []; particles = [];
  insects = []; frogs = [];
  view.zoom = 1; view.targetZoom = 1;
  view.x = cx; view.y = cy;
  view.targetX = cx; view.targetY = cy;
  pointers.clear();
  pinchStart = null; tapStart = null; panStart = null;
  vignette = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.34, cx, cy, Math.max(W, H) * 0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(0.62, 'rgba(0,10,8,0.18)');
  vignette.addColorStop(1, 'rgba(0,8,6,0.66)');
}

/* UI */
const btnFeed = document.getElementById('btnFeed');
const btnAuto = document.getElementById('btnAuto');
const btnSfx = document.getElementById('btnSfx');
const btnMusic = document.getElementById('btnMusic');
const btnFull = document.getElementById('btnFull');
const sfxIcon = document.getElementById('sfxIcon');
const fullIcon = document.getElementById('fullIcon');
const svgSpeakerOn = `<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/>`;
const svgSpeakerOff = `<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/>`;
const svgFull = `<path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>`;
const svgFullExit = `<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>`;
btnFeed.addEventListener('click', () => {
  feedMode = !feedMode;
  btnFeed.classList.toggle('on', feedMode);
  Sound.init();
  if (feedMode) hideHint();
});
btnAuto.addEventListener('click', () => {
  autoFeed = !autoFeed;
  btnAuto.classList.toggle('on', autoFeed);
  if (autoFeed) autoFeedTimer = 2;
  Sound.init();
});
btnSfx.addEventListener('click', () => {
  Sound.init();
  Sound.resume();
  const on = !Sound.sfxOn;
  Sound.setSfx(on);
  btnSfx.classList.toggle('on', on);
  sfxIcon.innerHTML = on ? svgSpeakerOn : svgSpeakerOff;
});
btnMusic.addEventListener('click', () => {
  Sound.init();
  Sound.resume();
  const on = !Sound.musicOn;
  Sound.setMusic(on);
  btnMusic.classList.toggle('on', on);
});

let wakeLockObj = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  if (wakeLockObj) return;
  try {
    wakeLockObj = await navigator.wakeLock.request('screen');
    wakeLockObj.addEventListener('release', () => { wakeLockObj = null; });
  } catch (e) {}
}
setInterval(() => { if (document.visibilityState === 'visible') requestWakeLock(); }, 6000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      fullIcon.innerHTML = svgFullExit;
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      fullIcon.innerHTML = svgFull;
    }
  } catch (e) {}
}
btnFull.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  fullIcon.innerHTML = document.fullscreenElement ? svgFullExit : svgFull;
});

/* INIT */
(function init() {
  try {
    const tc = document.createElement('canvas').getContext('2d');
    tc.filter = 'blur(2px)';
    supportsFilter = (tc.filter === 'blur(2px)');
  } catch (e) { supportsFilter = false; }
  causticA = ctx.createPattern(makeCausticTile(1, 2.4), 'repeat');
  causticB = ctx.createPattern(makeCausticTile(2.3, 3.1), 'repeat');
  causticC = ctx.createPattern(makeCausticTile(4.1, 1.9), 'repeat');
  Climate.waterTemp = 18;
  Climate.airTemp = 18;
  resize();
  let rTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rTimer);
    rTimer = setTimeout(resize, 220);
  });
  const unlock = () => { Sound.init(); Sound.resume(); requestWakeLock(); };
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
  setTimeout(hideHint, 12000);
  requestAnimationFrame(loop);
})();
</script>
